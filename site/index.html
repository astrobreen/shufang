  out += '<div class="center mt8"><div class="ph" style="font-size:19px;color:var(--accent);font-weight:650">' + esc(m.py) + '<\/div><div class="muted">' + esc(m.g) + '<\/div><\/div>';

  if (s.phase === 'watch') out += '<div class="actions"><button class="btn" data-act="replay">' + icon('replay', 'sm') + ' Replay<\/button><button class="btn pri" data-act="wgo">Start writing<\/button><\/div>';
  else if (s.phase === 'write') out += '<div class="actions"><button class="btn" data-act="whint">' + icon('hint', 'sm') + ' Hint<\/button><button class="btn" data-act="wguide">' + (s.guide ? 'Hide guide' : 'Show guide') + '<\/button><\/div><button class="btn ghost block mt8" data-act="wskip">Skip this character<\/button>';

}
function mountWrite() {
  var s = ses, c = s.chars[s.i];

  if (s.writer) { s.writer.destroy(); s.writer = null; }
  if (s.anim) { s.anim.stop(); s.anim = null; }
  var host = $('#padhost');

    var svg = $('svg.anim', host);

  } else if (s.phase === 'write') {

    s.writer = hzWriter(host, c, {
      guide: s.guide,
      onStroke: function (idx, ok, st) {
        var el = $('#snote');
        if (!el) return;
        if (ok) el.textContent = st.cur >= st.n ? 'Complete.' : 'Good. Stroke ' + (st.cur + 1) + ' of ' + st.n + '.';
        else el.textContent = st.order ? 'That stroke belongs later. Follow the stroke order.' : 'Not quite. Try again' + (st.curMiss >= 3 ? ' (hint shown).' : '.');
      },

        todayRow().ex++; save();
        setTimeout(function () { if (ses === s) { s.phase = 'done'; s.writer = null; render(); } }, 450);
      }
    });
  } else if (s.phase === 'done') {
    host.innerHTML = hzAnimHTML(c);
    var sv = $('svg.anim', host);
    if (sv) $$('.inkp', sv).forEach(function (p) { p.style.opacity = 1; });
  }
}

/* ---------- tones + listening ---------- */
function wordPool(filter) {
  var arr = [];
  dict.forEach(function (e) {
    if (e.lv === 0 || e.lv > uLevel() + 1 || e.h.length > 3 || e.py.length !== e.h.length) return;
    for (var i = 0; i < e.h.length; i++) if (!C.CJK.test(e.h[i])) return;
    if (filter && !filter(e)) return;
    arr.push(e);
  });
  return arr;
}
function toneStart() {
  var pool = wordPool(function (e) {
    if (/[不一]/.test(e.h)) return false;
    var t = e.py.map(C.toneOf);
    return t.every(function (x) { return x >= 1 && x <= 4; });
  });
  if (pool.length < 12) { pool = wordPool(function (e) { return e.py.map(C.toneOf).every(function (x) { return x >= 1 && x <= 4; }); }); }
  if (pool.length < 4) { toast('Not enough words yet at your level'); return; }
  var qs = C.shuffle(pool, 'tone' + now()).slice(0, 10).map(function (e) { return { h: e.h, py: e.py, g: e.gl[0] }; });
  startSession({ kind: 'tone', qs: qs, i: 0, picks: [], score: 0, done: false, auto: true });
}
function listenStart() {
  if (!hasVoice()) { toast('No Chinese voice found. Add one in your device’s text-to-speech settings.'); return; }
  var pool = wordPool(function (e) { return e.lv <= uLevel(); });
  if (pool.length < 12) pool = wordPool();
  var qs = C.shuffle(pool, 'lis' + now()).slice(0, 10).map(function (e) {
    var d = C.shuffle(pool.filter(function (x) { return x.h !== e.h && x.h.length === e.h.length; }), e.h + now()).slice(0, 3);
    var opts = C.shuffle([e].concat(d), e.h + 'o' + now()).map(function (x) { return { h: x.h, py: x.py, g: x.gl[0] }; });
    return { h: e.h, py: e.py, g: e.gl[0], opts: opts };
  });
  startSession({ kind: 'listen', qs: qs, i: 0, pick: -1, score: 0, done: false, auto: true });
}
function speakQ() { if (ses && ses.qs && ses.qs[ses.i]) speak(sc(ses.qs[ses.i].h)); }
function quizView() {
  var s = ses, q = s.qs[s.i];
  if (s.i >= s.qs.length) return resultView(s.kind === 'tone' ? 'Tone training' : 'Listening', s.score + '/' + s.qs.length, s.score >= 8 ? 'Excellent ear.' : s.score >= 5 ? 'Good. A little more practice will lock these in.' : 'Keep going. Tones take time and repetition.', s.kind === 'tone' ? 'tone-start' : 'listen-start');
  var out = sessHead(s.i / s.qs.length, (s.i + 1) + '/' + s.qs.length);
  if (s.kind === 'tone') {
    var n = q.py.length, k = s.picks.length, answered = s.done;
    var slots = q.py.map(function (p, j) {
      var base = C.parseSyl(p).b;
      if (answered) return '<span class="t' + C.toneOf(p) + 'c">' + esc(C.phon(p, S.set.phon)) + '<\/span>';
      if (j < k) return '<span class="t' + s.picks[j] + 'c">' + esc(C.phon(C.withTone(base, s.picks[j]), S.set.phon)) + '<\/span>';
      return '<span style="' + (j === k ? 'border-bottom:2px solid var(--accent)' : 'opacity:.5') + '">' + esc(base) + '<\/span>';
    }).join(' ');
    out += '<div class="qcard"><div class="qz" lang="' + lang() + '">' + esc(sc(q.h)) + '<\/div><div class="qp mt8" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">' + slots + '<\/div><p class="muted mt8">' + esc(q.g) + '<\/p>' +

    } else {
      var all = q.py.every(function (p, j) { return s.picks[j] === C.toneOf(p); });
      out += '<p class="center mt12" style="font-weight:650;color:var(--' + (all ? 'good' : 'bad') + ')">' + (all ? 'Correct' : 'You chose tone ' + s.picks.join(', ') + '. The answer is ' + q.py.map(function (p) { return C.toneOf(p); }).join(', ') + '.') + '<\/p><button class="btn pri block mt12" data-act="qnext">' + (s.i + 1 >= s.qs.length ? 'See result' : 'Next') + '<\/button>';
    }

      }).join('') + '<\/div>' + (ans ? '<button class="btn pri block mt12" data-act="qnext">' + (s.i + 1 >= s.qs.length ? 'See result' : 'Next') + '<\/button>' : '');
  }

}
function tonePick(t) {

/* ---------- grammar index ---------- */

    buf += '<button class="wrow" data-act="gramopen" data-lid="' + x.L.id + '" data-gi="' + x.gi + '"><span class="wm"><span style="font-weight:650;font-size:16px" lang="' + lang() + '">' + esc(sc(x.g.pattern)) + '<\/span><span class="wg">' + esc(x.g.expl) + '<\/span><\/span>' + icon('chev', 'sm') + '<\/button>';

  out += '<div class="hscroll mt12"><button class="chip' + (gui.lv === 0 ? ' on' : '') + '" data-act="glv" data-v="0">All<\/button>';

/* ---------- backup ---------- */
function exportData() {
  var name = 'shufang-backup-' + C.dayKey(now()) + '.json', data = JSON.stringify(S, null, 1);
  if (window.ShufangAndroid && typeof window.ShufangAndroid.saveFile === 'function') {   // the Android app: system "save as" dialog
    try { window.ShufangAndroid.saveFile(name, data); } catch (e) { toast('Could not save the file. Use Copy instead.'); }
    return;
  }
  try {
    var a = document.createElement('a'), url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000); toast('Backup saved');
  } catch (e) { toast('Saving files is not available here. Use Copy instead.'); }
}
function copyText(text, ok, fail) {
  try { navigator.clipboard.writeText(text).then(function () { toast(ok); }, function () { toast(fail); }); } catch (e) { toast(fail); }
}
function importData(file) {
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var inc = sanitize(JSON.parse(String(fr.result)));
      if (!hasData(inc) && inc.updatedAt === 0) { toast('That file has no Shufang data.'); return; }
      S = unionState(S, inc); S.updatedAt = now(); save();
      toast('Backup merged: ' + plural(S.words.length, 'word') + ', ' + plural(S.done.length, 'finished lesson'));
      render();
    } catch (e) { toast('That file could not be read.'); }
  };
  fr.readAsText(file);
}

/* ===== Dictionary tab ===== */
/* CC-CEDICT (about 115,000 entries) in site/dict.json, fetched the first time the tab or an entry is opened and then cached.
   Search takes Chinese (simplified or traditional), pinyin (with or without tone numbers) or English in one box. */
var DI = { ready: false, loading: false, failed: false, list: [], by: new Map(), pk: null, nk: null, en: null, waiters: [] };
var dui = { q: '', n: 40 }, dTimer = null, dCache = null;
var CJKQ = /[㐀-䶿一-鿿豈-﫿]/;
var VARIANT = /^(variant of|old variant|archaic variant|unofficial variant|erhua variant|Japanese variant|also written|see |same as|abbr\. for|surname |used in |\(Tw\)|Taiwan pr\.)/i;

function loadDict(cb) {
  if (DI.ready) { if (cb) cb(true); return; }
  if (cb) DI.waiters.push(cb);
  if (DI.loading) return;
  DI.loading = true; DI.failed = false;
  fetch('dict.json').then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).then(function (j) {
    DI.list = j.e.map(function (a) {
      return { h: a[0], t: a[1], py: a[2], pys: a[2].split(' '), d: a[3], cl: a[4], pn: /^[A-Z]/.test(a[2]) };
    });
    DI.list.forEach(function (e) {
      var a = DI.by.get(e.h); if (a) a.push(e); else DI.by.set(e.h, [e]);
      if (e.t) { var b = DI.by.get(e.t); if (b) b.push(e); else DI.by.set(e.t, [e]); }
    });
    DI.ready = true; DI.loading = false;
    DI.waiters.splice(0).forEach(function (f) { f(true); });
  }).catch(function () {
    DI.loading = false; DI.failed = true;
    DI.waiters.splice(0).forEach(function (f) { f(false); });
  });
}

/* search keys, built the first time a Latin-letter search is made */
function dictKeys() {
  if (DI.pk) return;
  DI.pk = []; DI.nk = []; DI.en = [];
  DI.list.forEach(function (e) {
    var lows = e.pys.map(function (s) { return s.toLowerCase(); });
    DI.pk.push(C.norm(lows.join('')));
    DI.nk.push(lows.map(function (s) { return C.norm(s) + C.toneOf(s); }).join(''));
    DI.en.push(e.d.join(' | ').toLowerCase());
  });
}

function variantish(e) { return VARIANT.test(e.d[0] || ''); }
function readingRank(e) { return (variantish(e) ? 2 : 0) + (e.pn ? 1 : 0); }
function dictEnts(h) {
  var a = (DI.by.get(h) || []).filter(function (e) { return e.h === h; });
  if (!a.length) a = DI.by.get(h) || [];
  return a.map(function (e, i) { return { e: e, i: i }; }).sort(function (x, y) { return readingRank(x.e) - readingRank(y.e) || x.i - y.i; }).map(function (x) { return x.e; });
}
function dictBest(h) { var a = dictEnts(h); return a.length ? a[0] : null; }
function dictGloss(e) {
  var good = e.d.filter(function (d) { return !VARIANT.test(d); });
  return (good.length ? good : e.d).slice(0, 3).join('; ');
}
function dictHz(e) { return S.set.script === 'trad' && e.t ? e.t : e.h; }
function dictSyl(s) { return S.set.phon === 'pinyin' ? s : C.phon(s.toLowerCase(), S.set.phon); }
function dictPh(pys) { return pys.map(dictSyl).join(' '); }
function dictPhHTML(pys) {
  return pys.map(function (s) {
    var t = esc(dictSyl(s));
    return S.set.tone ? '<span class="t' + C.toneOf(s.toLowerCase()) + 'c">' + t + '<\/span>' : t;
  }).join(' ');
}
function dictBonus(h) {
  var v = V.map.get(h);
  if (v) return 14 - v.lv;                    // HSK 1 words first
  return dict.has(h) ? 4 : 0;                 // then words from the lessons
}

function dictSearch(q) {
  if (dCache && dCache.q === q) return dCache.r;
  var res = new Map(), note = '', list = DI.list, i, e, s;
  function bump(e, s) { var c = res.get(e.h); if (!c || s > c.s) res.set(e.h, { h: e.h, s: s }); }
  if (CJKQ.test(q)) {
    var qs = q.replace(/\s+/g, ''), exact = false;
    for (i = 0; i < list.length; i++) {
      e = list[i]; s = 0;
      if (e.h === qs || e.t === qs) { s = 100; exact = true; }
      else if (e.h.indexOf(qs) === 0 || (e.t && e.t.indexOf(qs) === 0)) s = 70 - (e.h.length - qs.length) * 2;
      else if (e.h.indexOf(qs) > 0 || (e.t && e.t.indexOf(qs) > 0)) s = 40 - (e.h.length - qs.length);
      if (s) bump(e, s);
    }
    if (!exact && qs.length >= 2) {      // no entry for the whole text: list the words inside it, in order
      var k = 0, pos = 0, found = 0;
      while (pos < qs.length) {
        var hit = '';
        for (var len = Math.min(8, qs.length - pos); len >= 1; len--) {
          var sub = qs.substr(pos, len);
          if (DI.by.has(sub) && CJKQ.test(sub)) { hit = sub; break; }
        }
        if (hit) {
          DI.by.get(hit).forEach(function (en) { bump(en, 200 - k); });
          found++; k++; pos += hit.length;
        } else pos++;
      }
      if (found) note = 'No entry for the whole text. These are the words inside it, in order.';
    }
  } else {
    var ql = q.toLowerCase().trim();
    dictKeys();
    if (/^[a-zA-Z\u00fc\u00dc\u0100-\u01dc:\d\s'’·-]+$/.test(q)) {   // pinyin, with tone numbers or tone marks
      var qn = C.norm(ql.replace(/u:/g, 'v')), marked = false, qnum = ql.replace(/u:|ü/g, 'v').replace(/[^a-z0-9\s']/g, function (ch) { return /[\u0100-\u01dc]/.test(ch) ? ch : ''; });
      var toks = qnum.split(/[\s'’·-]+/).filter(Boolean);
      qnum = toks.map(function (tk) {
        if (!/[\u0100-\u01dc]/.test(tk)) return tk.replace(/[^a-z0-9]/g, '');
        var n = C.norm(tk), tn = C.toneOf(tk);
        if (tn >= 1 && tn <= 5 && /^[a-z]+$/.test(n) && n.length <= 6) { marked = true; return n + tn; }
        return n;
      }).join('');
      var hasDig = marked || /[1-5]/.test(q);
      if (qn.length) {
        for (i = 0; i < list.length; i++) {
          s = 0;
          if (hasDig) { var nk = DI.nk[i]; if (nk === qnum) s = 90; else if (nk.indexOf(qnum) === 0) s = 60 - (nk.length - qnum.length) * 0.3; }
          else { var pk = DI.pk[i]; if (pk === qn) s = 80; else if (qn.length >= 2 && pk.indexOf(qn) === 0) s = 50 - (pk.length - qn.length) * 0.8; }
          if (s) bump(list[i], s);
        }
      }
    }
    if (ql.length >= 2) {                                   // English
      var re = new RegExp('(^|[^a-z])' + ql.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z])');
      for (i = 0; i < list.length; i++) {
        if (DI.en[i].indexOf(ql) < 0) continue;
        e = list[i]; var best = 0;
        for (var j = 0; j < e.d.length; j++) {
          var dl = e.d[j].toLowerCase(), st = dl.replace(/^to /, '').replace(/\s*\([^)]*\)\s*/g, ' ').trim(), sc2 = 0;
          if (dl === ql || st === ql || dl === 'to ' + ql) sc2 = 85;
          else if (st.indexOf(ql + ' ') === 0 || st.indexOf(ql + ',') === 0) sc2 = 62;
          else if (re.test(dl)) sc2 = 45;
          else if (ql.length >= 3) sc2 = 22;
          if (sc2 && j === 0) sc2 += 8;
          if (sc2 > best) best = sc2;
        }
        if (!best) continue;
        if (variantish(e)) best -= 25;
        bump(e, best - e.h.length * 0.6 - (e.h.length === 1 && !V.map.has(e.h) ? 4 : 0));   // a bound character (鹦, 鹉) ranks below the word (鹦鹉)
      }
    }
  }
  var groups = Array.from(res.values()).map(function (g) {
    var ents = dictEnts(g.h), main = ents[0];
    g.s += dictBonus(g.h) - (main && main.pn ? 10 : 0);
    g.ents = ents;
    return g;
  }).sort(function (a, b) { return b.s - a.s || a.h.length - b.h.length; });
  var r = { groups: groups.slice(0, 400), note: note };
  dCache = { q: q, r: r };
  return r;
}

function dictRow(g) {
  var m = g.ents[0], v = V.map.get(g.h), lv = v ? v.lv : (dict.has(g.h) ? dict.get(g.h).lv : 0);
  return '<button class="wrow" data-act="dictinfo" data-h="' + esc(g.h) + '"><span class="hz" lang="' + lang() + '">' + esc(dictHz(m)) + '<\/span>' +
    '<span class="wm"><span class="wp">' + esc(dictPh(m.pys)) + '<\/span><span class="wg">' + esc(dictGloss(m)) + '<\/span><\/span>' +
    '<span class="ws">' + (lv ? lvBadge(lv) : '') + (g.ents.length > 1 ? '<span class="tag">' + g.ents.length + ' readings<\/span>' : '') + '<\/span><\/button>';
}
function dictHome() {
  var out = '';
  if (S.hist.length) {
    var rows = S.hist.map(function (h) { var a = dictEnts(h); return a.length ? dictRow({ h: h, ents: a }) : ''; }).join('');
    if (rows) out += '<div class="rowhead"><h2 class="h2">Recent<\/h2><button class="btn ghost sm" data-act="dclearhist">Clear<\/button><\/div><div class="group">' + rows + '<\/div>';
  }
  out += '<div class="empty dhint"><h3>Search the dictionary<\/h3><p>Type Chinese, pinyin or English. Pinyin works with or without tone numbers.<\/p>' +
    '<div class="chiprow">' + [['你好', ''], ['shu', ''], ['library', ''], ['ni3hao3', '']].map(function (x) { return '<button class="chip" data-act="dtry" data-v="' + esc(x[0]) + '">' + esc(x[0]) + '<\/button>'; }).join('') + '<\/div>' +
    '<p class="small muted mt12">' + DI.list.length.toLocaleString() + ' entries from CC-CEDICT. Tap any word for every meaning, its characters and stroke order.<\/p><\/div>';
  return out;
}
function dictList() {
  if (!DI.ready) {
    if (DI.failed) return '<div class="empty"><h3>Could not load the dictionary<\/h3><p>It needs a connection the first time. After that it works offline.<\/p><button class="btn mt8" data-act="dretry">Retry<\/button><\/div>';
    return '<div class="empty"><h3>Loading the dictionary…<\/h3><\/div>';
  }
  var q = dui.q.trim();
  if (!q) return dictHome();
  var r = dictSearch(q);
  if (!r.groups.length) return '<div class="empty"><h3>No matches<\/h3><p>Try fewer letters, another spelling, or the characters themselves.<\/p><\/div>';
  var shown = r.groups.slice(0, dui.n);
  return (r.note ? '<p class="note">' + esc(r.note) + '<\/p>' : '') + '<div class="group">' + shown.map(dictRow).join('') + '<\/div>' +
    (r.groups.length > shown.length ? '<button class="btn block mt12" data-act="dmore">Show more (' + (r.groups.length - shown.length) + ')<\/button>' : '');
}
function refreshDictList() { var el = $('#dlist'); if (el) el.innerHTML = dictList(); }
function scheduleDictList() { clearTimeout(dTimer); dTimer = setTimeout(refreshDictList, 90); }

function inDict() { return view === 'words' && wui.tab === 'dict'; }
function dictBody() {

/* ===== Dictionary: write a character =====
   A pad in the Dictionary view.  Strokes are matched against site/hw.json (the stroke centre-lines of the same ~3,000
   characters used for stroke order) by Core.hwRank, which pairs strokes by cheapest assignment, so the order they are
   written in matters only a little.  Tapping a candidate adds it to the search box. */
var HWI = { ready: false, loading: false, failed: false, idx: null, waiters: [] };
var HWS = [], HWC = [], hwDraw = null, hwTimer = null;

function loadHw(cb) {
  if (HWI.ready) { if (cb) cb(true); return; }
  if (cb) HWI.waiters.push(cb);
  if (HWI.loading) return;
  HWI.loading = true; HWI.failed = false;
  fetch('hw.json').then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).then(function (j) {
    HWI.idx = C.hwIndex(j); HWI.ready = true; HWI.loading = false;
    HWI.waiters.splice(0).forEach(function (f) { f(true); });
  }).catch(function () {
    HWI.loading = false; HWI.failed = true;
    HWI.waiters.splice(0).forEach(function (f) { f(false); });
  });
}

function hwPath(pts) {
  if (!pts.length) return '';
  if (pts.length === 1) return 'M ' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1) + ' l 0.01 0';
  return 'M ' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L ');
}
function hwCandsHTML() {
  if (HWI.failed) return '<span class="small muted">Could not load the handwriting data. It needs a connection the first time.<\/span> <button class="btn ghost sm" data-act="hwretry">Retry<\/button>';
  if (!HWI.ready) return '<span class="small muted">Loading…<\/span>';
  if (!HWS.length) return '<span class="small muted">Write one character below. Its best matches appear here.<\/span>';
  if (!HWC.length) return '<span class="small muted">No match. Check the number of strokes, or clear and try again.<\/span>';
  return HWC.map(function (c) { return '<button class="hwc" data-act="hwpick" data-c="' + esc(c) + '" lang="' + lang() + '" aria-label="' + esc(c) + '">' + esc(sc(c)) + '<\/button>'; }).join('');
}
function hwBoxHTML() {
  var ink = HWS.map(function (s) { return '<path class="hwink" d="' + hwPath(s) + '"/>'; }).join('');
  return '<div class="hwbox" id="hwbox"><div class="hwcands" id="hwcands">' + hwCandsHTML() + '<\/div>' +
    '<div class="hwwrap"><svg class="hwpad" id="hwpad" viewBox="0 0 100 100" role="img" aria-label="Writing pad"><path class="gl" d="M50 0V100M0 50H100"/><g id="hwink">' + ink + '<\/g><path class="hwlive" id="hwlive" d=""/><\/svg><\/div>' +
    '<div class="hwbtns"><button class="btn" data-act="hwundo"' + (HWS.length ? '' : ' disabled') + '>Undo<\/button><button class="btn" data-act="hwclear"' + (HWS.length ? '' : ' disabled') + '>Clear<\/button>' +
    '<button class="btn" data-act="hwdel"' + (dui.q ? '' : ' disabled') + ' aria-label="Delete the last character in the search box">Delete<\/button><\/div>' +
    '<p class="small muted mt8" style="text-align:center">Stroke order is flexible, but draw every stroke. One character at a time.<\/p><\/div>';
}
function hwRefreshBox() {

}
function hwRecognize() {

  if (!HWI.ready) { loadHw(function () { if (inDict() && dui.hw) hwRecognize(); }); hwRefreshBox(); return; }
  hwTimer = setTimeout(function () {                 // after the ink is on screen; a later stroke cancels an earlier search
    HWC = C.hwRank(HWS, HWI.idx, 12).map(function (r) { return r.c; });
    hwRefreshBox();
  }, 25);
}
function hwSetQuery(q) {

function hwClearInk() { HWS = []; HWC = []; var g = $('#hwink'); if (g) g.innerHTML = ''; var l = $('#hwlive'); if (l) l.setAttribute('d', ''); }

function hwPoint(ev, svg) {
  var r = svg.getBoundingClientRect();
  return [Math.min(100, Math.max(0, (ev.clientX - r.left) / r.width * 100)), Math.min(100, Math.max(0, (ev.clientY - r.top) / r.height * 100))];
}
document.addEventListener('pointerdown', function (ev) {
  var svg = ev.target && ev.target.closest && ev.target.closest('#hwpad');
  if (!svg || ev.button > 0) return;
  ev.preventDefault();
  try { svg.setPointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
  hwDraw = { id: ev.pointerId, svg: svg, pts: [hwPoint(ev, svg)] };
  $('#hwlive').setAttribute('d', hwPath(hwDraw.pts));
});
document.addEventListener('pointermove', function (ev) {
  if (!hwDraw || ev.pointerId !== hwDraw.id) return;
  ev.preventDefault();
  var evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
  if (!evs.length) evs = [ev];
  evs.forEach(function (e) {
    var p = hwPoint(e, hwDraw.svg), l = hwDraw.pts[hwDraw.pts.length - 1];
    if (Math.hypot(p[0] - l[0], p[1] - l[1]) > 0.7) hwDraw.pts.push(p);
  });
  var live = $('#hwlive'); if (live) live.setAttribute('d', hwPath(hwDraw.pts));
});
function hwEnd(ev, cancel) {
  if (!hwDraw || ev.pointerId !== hwDraw.id) return;
  var pts = hwDraw.pts; hwDraw = null;
  var live = $('#hwlive'); if (live) live.setAttribute('d', '');
  if (cancel || !pts.length) return;
  HWS.push(pts);
  var g = $('#hwink');
  if (g) { var p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('class', 'hwink'); p.setAttribute('d', hwPath(pts)); g.appendChild(p); }
  hwRecognize();
}
document.addEventListener('pointerup', function (ev) { hwEnd(ev, false); });
document.addEventListener('pointercancel', function (ev) { hwEnd(ev, true); });
document.addEventListener('contextmenu', function (ev) { if (ev.target && ev.target.closest && ev.target.closest('#hwpad')) ev.preventDefault(); });

/* ===== Practice: speaking =====
   Read a sentence from the lessons aloud.  The browser's speech recognition turns the voice into text and Core.speakCompare
   marks which characters were heard.  It checks that the right words came out, not tones or sounds, and only appears in
   browsers that have speech recognition. */
var SPREC = window.SpeechRecognition || window.webkitSpeechRecognition || null, spRec = null;
function speakOk() {
  if (!SPREC || window.ShufangAndroid) return false;
  var pp = document.permissionsPolicy || document.featurePolicy;           // a page embedded without microphone access cannot use it
  try { if (pp && pp.allowsFeature && !pp.allowsFeature('microphone')) return false; } catch (e) { /* ignore */ }
  return true;
}
function spAccepted() { try { return localStorage.getItem('shufang.speakok') === '1'; } catch (e) { return false; } }
function spAccept() { try { localStorage.setItem('shufang.speakok', '1'); } catch (e) { /* ignore */ } }
function spStop() { if (spRec) { var r = spRec; spRec = null; r.onresult = r.onerror = r.onend = null; try { r.abort(); } catch (e) { /* ignore */ } } }

function speakStart() {
  var lv = Math.max(uLevel(), 1) + 1, pool = [];
  LESSONS.forEach(function (L) {
    if (L.level > lv || L.type === 'poem' || L.type === 'classic') return;
    L.sents.forEach(function (s) {
      var txt = sentText(s), n = Array.from(txt).filter(function (ch) { return C.CJK.test(ch); }).length;
      if (n < 4 || n > 14 || !s.en) return;
      for (var i = 0; i < s.t.length; i++) { var t = s.t[i]; if (t.h && t.lv > lv) return; }
      pool.push({ t: s.t, zh: txt, en: s.en, py: null });
    });
  });
  if (pool.length < 8) { toast('Not enough sentences at your level yet'); return; }
  var qs = C.shuffle(pool, 'spk' + now()).slice(0, 8);
  startSession({ kind: 'speak', qs: qs, i: 0, st: spAccepted() ? 'idle' : 'notice', res: null, tries: 0, score: 0, msg: '' });
}
function speakView() {
  var s = ses;
  if (s.i >= s.qs.length) return resultView('Speaking', s.score + '/' + s.qs.length, s.score >= 7 ? 'Clear and confident.' : s.score >= 4 ? 'Good. Say them slowly and clearly if one is missed.' : 'Keep going. Speak a little slower and closer to the microphone.', 'speak-start');
  if (s.st === 'notice') {
    return sessHead(0, '') + '<div class="qcard"><div class="ti" style="width:54px;height:54px;border-radius:16px;display:grid;place-items:center;margin:0 auto 10px;background:var(--accent-soft);color:var(--accent)">' + icon('mic') + '<\/div>' +
      '<h2 style="font:750 20px var(--f-ui);letter-spacing:-.02em">Before you speak<\/h2>' +
      '<p class="muted mt8">This uses your browser’s speech recognition to turn your voice into text. Depending on the browser, the recording may be sent to the browser’s maker to do that (Chrome sends it to Google). Shufang itself records and keeps nothing.<\/p>' +
      '<p class="muted mt8">It checks that the right words were heard. It does not grade your tones.<\/p><\/div>' +
      '<div class="actions"><button class="btn pri" data-act="sok">Continue<\/button><button class="btn" data-act="end">Not now<\/button><\/div>';
  }
  var q = s.qs[s.i], out = sessHead(s.i / s.qs.length, (s.i + 1) + '/' + s.qs.length), r = s.res, line;
  if (r && s.st === 'result') {
    var k = 0;
    line = '<span class="zq" lang="' + lang() + '">' + q.t.map(function (t) {
      var txt = t.h ? tokSc(t) : t.p;
      return Array.from(txt).map(function (ch) {
        if (!C.CJK.test(ch)) return esc(ch);
        var ok = r.marks[k++];
        return '<span class="' + (ok ? 'sp-ok' : 'sp-no') + '">' + esc(ch) + '<\/span>';
      }).join('');
    }).join('') + '<\/span>';
  } else line = zhRuby(q.t);
  out += '<div class="qcard"><div class="spk-line">' + line + '<\/div><p class="muted mt8">' + esc(q.en) + '<\/p>' +
    (hasVoice() ? '<button class="btn sm mt8" data-act="spsay">' + icon('say', 'sm') + ' Listen<\/button>' : '') + '<\/div>';
  if (s.st === 'result') {
    var pass = r.ok;
    out += '<p class="center mt12" style="font-weight:650;color:var(--' + (pass ? 'good' : 'bad') + ')">' + (pass ? (r.score >= 0.99 ? 'Well said' : 'Good') : (r.heard ? 'Not quite. Red characters were not heard.' : 'Nothing recognised.')) + '<\/p>' +
      (r.heard && !pass ? '<p class="small muted center mt8">Heard: <span class="zh" lang="' + lang() + '">' + esc(r.heard) + '<\/span><\/p>' : '') +
      '<div class="actions">' + (pass ? '' : '<button class="btn' + (s.tries >= 2 ? '' : ' pri') + '" data-act="smic">Try again<\/button>') + '<button class="btn' + (pass || s.tries >= 2 ? ' pri' : '') + '" data-act="snext">' + (s.i + 1 >= s.qs.length ? 'See result' : 'Next') + '<\/button><\/div>';
  } else {
    out += '<div class="center mt16"><button class="micbtn' + (s.st === 'listen' ? ' on' : '') + '" data-act="smic" aria-label="' + (s.st === 'listen' ? 'Stop listening' : 'Speak') + '">' + icon('mic') + '<\/button>' +
      '<p class="hint mt8">' + (s.st === 'listen' ? 'Listening… tap to stop' : (s.msg ? esc(s.msg) : 'Tap, then read the sentence aloud')) + '<\/p><\/div>' +
      '<p class="center mt12"><button class="btn ghost sm" data-act="snext">Skip<\/button><\/p>';
  }
  return out;
}
function speakMic() {
  var s = ses;
  if (!s || s.kind !== 'speak') return;
  if (s.st === 'listen') { if (spRec) { try { spRec.stop(); } catch (e) { /* ignore */ } } return; }
  stopSpeech(); spStop();
  var qi = s.i, got = null, err = '', rec;
  try { rec = new SPREC(); } catch (e) { s.st = 'idle'; s.msg = 'Speech recognition could not start in this browser.'; render(); return; }
  rec.lang = 'zh-CN'; rec.interimResults = false; rec.continuous = false; rec.maxAlternatives = 5;
  rec.onresult = function (ev) {
    var alts = [], res = ev.results && ev.results[0];
    if (res) for (var i = 0; i < res.length; i++) alts.push(res[i].transcript);
    if (alts.length) got = alts;
  };
  rec.onerror = function (ev) { err = ev && ev.error || 'error'; };
  rec.onend = function () {
    if (spRec !== rec) return;
    spRec = null;
    if (!ses || ses.kind !== 'speak' || ses.i !== qi) return;
    if (got) {
      var r = C.speakCompare(ses.qs[qi].zh, got);
      ses.res = r; ses.st = 'result'; ses.tries++; ses.msg = '';
      if (r.ok) { if (ses.tries === 1) ses.score++; todayRow().ex++; save(); }
    } else {
      ses.st = 'idle';
      ses.msg = err === 'not-allowed' || err === 'service-not-allowed' ? 'The microphone is blocked. Allow it for this site in your browser’s settings, then tap again.' :
        err === 'audio-capture' ? 'No microphone was found.' :
        err === 'network' ? 'Speech recognition needs an internet connection.' :
        err === 'language-not-supported' ? 'This browser has no Chinese speech recognition.' :
        'I did not hear anything. Tap and try again.';
    }
    render();
  };
  spRec = rec; s.st = 'listen'; s.msg = '';
  try { rec.start(); } catch (e) { spRec = null; s.st = 'idle'; s.msg = 'Speech recognition could not start. Tap again.'; }
  render();
}
function speakNext() {
  var s = ses; spStop();
  s.i++; s.st = 'idle'; s.res = null; s.tries = 0; s.msg = '';
  render(); window.scrollTo(0, 0);
}

  switch (a) {
    case 'tab': gotoTab(d.v); break;
    case 'lvl': hui.lv = +d.v; render(); break;
    case 'type': hui.type = hui.type === d.v ? 'all' : d.v; render(); break;
    case 'unread': hui.unread = !hui.unread; render(); break;
    case 'marked': hui.marked = !hui.marked; render(); break;
    case 'script': setSetting('script', S.set.script === 'simp' ? 'trad' : 'simp'); break;
    case 'bm': { var bi = S.marks.indexOf(d.id); if (bi >= 0) S.marks.splice(bi, 1); else S.marks.push(d.id); save(); render(); break; }
    case 'open': if (sh) closeSheet(); openLesson(d.id); if (d.g != null && d.g !== '') { rd.gram = +d.g; renderReader(true); var f = $('.w.gm'); if (f) f.scrollIntoView({ block: 'center' }); } break;
    case 'back': closeSheet(); if (rd) closeReader(); break;
    case 'vis': setSetting('vis', { all: 'smart', smart: 'off', off: 'all' }[S.set.vis]); toast('Pronunciation guide: ' + { all: 'always shown', smart: 'smart', off: 'hidden' }[S.set.vis]); break;
    case 'transall': setSetting('trans', !S.set.trans); break;
    case 'display': openSheet({ kind: 'display' }); break;
    case 'plays': if (rd.playing && rd.once && rd.cur === +d.si) pausePlay(); else playFrom(+d.si, true); break;
    case 'trs': {
      if (S.set.trans) { toast('Translations are always on. Turn them off with 译 at the top.'); break; }
      var si = +d.si; rd.open[si] = !rd.open[si];
      var se = $('#s' + si); $('.tr', se).hidden = !rd.open[si]; el.classList.toggle('on', !!rd.open[si]); el.setAttribute('aria-pressed', !!rd.open[si]);
      break;
    }
    case 'gram': rd.gram = rd.gram === +d.g ? -1 : +d.g; renderReader(true); if (rd.gram >= 0) { var g1 = $('.w.gm'); if (g1) g1.scrollIntoView({ block: 'center', behavior: 'smooth' }); } break;
    case 'qen': rd.quizEn = !rd.quizEn; renderReader(true); break;
    case 'ans': if (rd.quiz[+d.q] == null) { rd.quiz[+d.q] = d.o; todayRow().ex++; save(); renderReader(true); } break;
    case 'finish': finishLesson(); break;
    case 'savenew': {
      var nw = newWordsOf(rd.L).slice(0, 25);
      nw.forEach(function (w) { if (!savedSet.has(w.h)) S.words.push(newCard(w.h, { lid: w.lid, si: w.si })); });
      save(); toast('Added ' + plural(nw.length, 'word') + ' to review'); closeSheet(); renderReader(true); break;
    }
    case 'tog': setSetting(d.k, !S.set[d.k]); break;
    case 'prev': case 'next': {
      var n = rd.L.sents.length; rd.cur = clamp(rd.cur + (a === 'next' ? 1 : -1), 0, n - 1);
      if (rd.playing) playFrom(rd.cur, rd.once); else { markPlaying(rd.cur, true); updateAudioBar(); }
      break;
    }
    case 'play': if (rd.playing && !rd.once) pausePlay(); else playFrom(rd.cur, false); break;
    case 'rate': { var ri = RATES.indexOf(S.set.rate); S.set.rate = RATES[(ri + 1) % RATES.length]; save(); if (rd.playing) playFrom(rd.cur, rd.once); else updateAudioBar(); break; }
    case 'close': closeSheet(); break;
    case 'set': { var v = d.v; S.set[d.k] = v; save(); refresh(); break; }
    case 'learn': learnNew(+d.n); break;
    case 'flash-start': flashStart(); break;
    case 'tone-start': toneStart(); break;
    case 'listen-start': listenStart(); break;
    case 'speak-start': speakStart(); break;
    case 'sok': spAccept(); ses.st = 'idle'; render(); break;
    case 'smic': speakMic(); break;
    case 'snext': speakNext(); break;
    case 'spsay': speak(ses.qs[ses.i].zh); break;
    case 'write-start': writeStart(); break;
    case 'write-char': writeStart([d.c]); break;
    case 'wordinfo':
      openSheet({ kind: 'word', h: d.h, ctx: {} });
      if (!V.ready) loadVocab(function () { if (sh && sh.kind === 'word' && sh.h === d.h) renderSheet(); });
      break;
    case 'dictinfo': openDictEntry(d.h); break;
    case 'dtry': dui.q = d.v; dui.n = 40; render(); break;
    case 'dmore': dui.n += 40; { var dl = $('#dlist'); if (dl) dl.innerHTML = dictList(); } break;
    case 'hwtoggle': dui.hw = !dui.hw; render(); break;
    case 'hwundo': HWS.pop(); { var hg = $('#hwink'); if (hg && hg.lastChild) hg.removeChild(hg.lastChild); } hwRecognize(); break;
    case 'hwclear': hwClearInk(); hwRefreshBox(); break;
    case 'hwpick': hwSetQuery(dui.q + d.c); hwClearInk(); hwRefreshBox(); break;
    case 'hwdel': hwSetQuery(Array.from(dui.q).slice(0, -1).join('')); hwRefreshBox(); break;
    case 'hwretry': HWI.failed = false; loadHw(function () { if (inDict() && dui.hw) { if (HWS.length) hwRecognize(); else hwRefreshBox(); } }); hwRefreshBox(); break;
    case 'dclearhist': S.hist = []; save(); render(); break;
    case 'dretry': DI.failed = false; loadDict(function () { if (inDict() && !rd && !ses) refreshDictList(); }); render(); break;
    case 'char':
      openSheet({ kind: 'char', c: d.c });
      if (!V.ready) loadVocab(function () { if (sh && sh.kind === 'char') { var ph = $('#sheet .ph'); if (ph) ph.firstChild.textContent = readingsOf(sh.c).map(function (r) { return C.phon(r, S.set.phon); }).join(' · '); } });
      break;
    case 'replay': {
      var host = ses && ses.kind === 'write' ? ses : sh, svg = ses && ses.kind === 'write' ? $('#padhost svg.anim') : $('#chanim svg.anim');
      if (host && svg) { if (host.anim) host.anim.stop(); host.anim = hzPlay(svg); }
      break;
    }
    case 'ppage': pui.page = d.v; render(); window.scrollTo(0, 0); break;
    case 'glv': gui.lv = +d.v; render(); break;
    case 'gramopen': openSheet({ kind: 'gram', lid: d.lid, gi: +d.gi }); break;
    case 'wtab': wui.tab = d.v; wui.q = ''; wui.n = 60; if (d.v === 'hsk' && !wui.lv) wui.lv = clamp(uLevel(), 1, 9); render(); break;
    case 'cyf': wui.cf = d.v; wui.q = ''; render(); break;
    case 'wfilter': wui.f = d.v; wui.n = 60; render(); break;
    case 'wlv': wui.lv = +d.v; wui.q = ''; wui.n = 60; render(); break;
    case 'more': wui.n += 60; { var wl = $('#wlist'); if (wl) wl.innerHTML = wui.tab === 'mine' ? myWordsList() : wui.tab === 'cy' ? cyList() : hskList(); } break;
    case 'retryvocab': V.failed = false; loadVocab(function () { render(); }); render(); break;
    case 'say': if (rd && rd.playing) pausePlay(); speak(sc(d.h)); break;
    case 'say-text': if (rd && rd.playing) pausePlay(); speak(d.t); break;
    case 'save': toggleSave(d.h, sh && sh.ctx); refresh(); break;
    case 'known': toggleKnown(d.h); refresh(); break;
    case 'flag':
      S.flags.push({ lid: d.lid, si: +d.si, at: now(), note: d.h }); S.flags = S.flags.slice(-60); save();
      toast('Noted. Find it under Me, Reported mistakes.'); break;
    case 'flip': ses.flip = !ses.flip; render(); break;
    case 'grade': flashGrade(d.g); break;
    case 'end': if (ses) endSession(); else closeSheet(); break;
    case 'wgo': ses.phase = 'write'; render(); break;
    case 'whint': if (ses.writer) ses.writer.hint(); break;
    case 'wguide': ses.guide = !ses.guide; S.set.guide = ses.guide; save(); if (ses.writer) ses.writer.guide(ses.guide); el.textContent = ses.guide ? 'Hide guide' : 'Show guide'; break;
    case 'wskip': case 'wnext': ses.i++; ses.phase = 'watch'; render(); window.scrollTo(0, 0); break;
    case 'tpick': tonePick(+d.t); break;
    case 'lpick': listenPick(+d.j); break;
    case 'qnext': quizNext(); break;
    case 'qsay': speakQ(); break;
    case 'mylevel': S.set.level = +d.v; save(); render(); break;
    case 'goal': S.set.goal = +d.v; save(); render(); break;
    case 'finder': startFinder(); break;
    case 'fstart': finder.intro = false; finder.lo = 0; finder.hi = 9; finder.rounds = 0; finder.asked = 0; finder.right = 0; finder.hist = []; finder.res = null; finderNext(); renderSheet(); $('#sheet').scrollTop = 0; break;
    case 'fans': finderAnswer(+d.j); renderSheet(); $('#sheet').scrollTop = 0; break;
    case 'fapply': S.set.level = finder.res; save(); closeSheet(); render(); toast(S.set.level ? 'Level set to HSK ' + S.set.level : 'Level set to New'); break;
    case 'export': exportData(); break;
    case 'copy': copyText(JSON.stringify(S), 'Backup copied. Paste it somewhere safe.', 'Copy was blocked. Try Save file.'); break;
    case 'import': $('#imp').click(); break;
    case 'reset':
      if (!resetArm) { resetArm = true; render(); setTimeout(function () { if (resetArm) { resetArm = false; if (view === 'me' && !rd && !ses) render(); } }, 4000); }
      else { resetArm = false; S = fresh(); S.updatedAt = now(); save(); toast('Progress erased'); render(); }
      break;
    case 'copyflags':
      copyText(S.flags.map(function (f) { var L = byId.get(f.lid); return (L ? L.id + ' ' + L.titleEn : f.lid) + ' / sentence ' + (f.si + 1) + ' / ' + f.note; }).join('\n'), 'List copied', 'Copy was blocked'); break;
    case 'clearflags': S.flags = []; save(); render(); break;
  }
}

document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.id === 'sheetwrap') { closeSheet(); return; }
  var el = t.closest('[data-act]');
  if (el && !el.disabled) { e.preventDefault(); act(el.dataset.act, el, e); return; }
  if (rd) {
    var w = t.closest('.w');
    var sent = t.closest('.sent');
    if (document.body.classList.contains('listen') && sent && !sent.classList.contains('peek')) { sent.classList.add('peek'); rd.peek[sent.dataset.si] = 1; return; }
    if (w) { onWord(w); return; }
  }
});
if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) {
  document.addEventListener('mouseover', function (e) { var w = rd && e.target.closest && e.target.closest('.w'); if (w) showTip(w); });
  document.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('.w')) hideTip(); });
  window.addEventListener('scroll', hideTip, { passive: true });
}
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('[data-act][tabindex]')) { e.preventDefault(); t.click(); return; }
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
  if (e.key === 'Escape') { if (sh) closeSheet(); else if (ses) endSession(); else if (rd) closeReader(); return; }
  if (ses && ses.kind === 'flash' && ses.q.length) {
    if (!ses.flip && (e.key === ' ' || e.key === 'Enter') && t.tagName !== 'BUTTON') { e.preventDefault(); ses.flip = true; render(); }
    else if (ses.flip && '123'.indexOf(e.key) >= 0 && e.key) flashGrade(['again', 'hard', 'good'][+e.key - 1]);
  }
});
/* Android back button (the app's WebView asks this first; false means "nothing to close, leave the app") */
window.__androidBack = function () {
  if (sh) { closeSheet(); return true; }
  if (ses) { endSession(); return true; }
  if (rd) { closeReader(); return true; }
  if (view !== 'today') { gotoTab('today'); return true; }
  return false;
};
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'lq') { hui.q = t.value; var l = $('#llist'); if (l) l.innerHTML = lessonList(); }
  else if (t.id === 'wq') { wui.q = t.value; wui.n = 60; var wl = $('#wlist'); if (wl) wl.innerHTML = wui.tab === 'mine' ? myWordsList() : wui.tab === 'cy' ? cyList() : hskList(); var cc = $('#cychips'); if (cc) cc.innerHTML = cyChips(); }
  else if (t.id === 'dq') { dui.q = t.value; dui.n = 40; scheduleDictList(); }
  else if (t.id === 'gq') { gui.q = t.value; var gl = $('#glist'); if (gl) gl.innerHTML = grammarList(); }
  else if (t.dataset && t.dataset.range) {
    S.set[t.dataset.range] = +t.value;
    if (t.dataset.range === 'size' && rd) $('#reader').style.setProperty('--fs', S.set.size);
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.range) { S.set[t.dataset.range] = +t.value; save(); }
  else if (t.dataset && t.dataset.sel === 'voice') { S.set.voice = t.value; save(); }
  else if (t.id === 'imp' && t.files && t.files[0]) { importData(t.files[0]); t.value = ''; }
});
document.addEventListener('visibilitychange', function () { if (document.hidden) stopSpeechSoft(); });
function stopSpeechSoft() { if (rd && rd.playing) pausePlay(); }

caches();
render();

})();
</script>

if ('serviceWorker' in navigator && location.protocol !== 'file:' && !/ShufangApp/.test(navigator.userAgent)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
