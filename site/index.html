<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D0C" media="(prefers-color-scheme: dark)">
<meta name="description" content="Shufang 书房: a graded Chinese reader and study room with HSK 3.0 levels 1 to 9.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shufang">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Shufang</title>
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html:root { color-scheme: light dark; }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
/* Shufang 书房 — a calm all-in-one Chinese study room.
   Design: warm paper neutrals, one China-red accent, hairline rules, large quiet type. Nine level hues run jade -> vermilion.
   Layout: five tabs (Today, Read, Words, Practice, Me); lessons and drills open full-screen. */
:root {
  --bg: #F6F5F1; --surf: #FFFFFF; --surf2: #EFEEE9; --ink: #16191A; --ink2: #575D5F; --ink3: #8B9193;
  --line: #E3E1DA; --accent: #C8281E; --accent-ink: #FFFFFF; --accent-soft: #F9E2DE;
  --warn: #8A5600; --warn-soft: #FAEBCB; --bad: #8F2A1F; --bad-soft: #F6E0DB; --good: #1E7A45; --good-soft: #DAF0E1;
  --seal: #C8281E; --hl: #FBEBE7; --gram: #FFE79E; --grid: #CFCDC4; --shadow: 0 1px 2px rgba(20,24,24,.05), 0 8px 24px rgba(20,24,24,.06);
  --l1: #2D9D6A; --l2: #1D998B; --l3: #1C8DB3; --l4: #3E76CE; --l5: #6964D3; --l6: #9556C6; --l7: #BC4EA6; --l8: #CE4B7B; --l9: #D14F39;
  --t1: #CC4439; --t2: #2C9760; --t3: #3A70D4; --t4: #8A4EC6; --t5: #7A8386;
  --ink-hz: #1B1E1F;
  --f-ui: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --f-zh: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", "WenQuanYi Micro Hei", sans-serif;
  --f-kai: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", SimSun, serif;
  --f-serif: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", "Source Han Serif SC", STSong, SimSun, "Iowan Old Style", Georgia, serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0E0E; --surf: #161919; --surf2: #202424; --ink: #EDEFEC; --ink2: #A6AEAC; --ink3: #737B79;
    --line: #272C2B; --accent: #F2685C; --accent-ink: #2A0806; --accent-soft: #3A1B18;
    --warn: #E4A94B; --warn-soft: #3A2D12; --bad: #F18A7E; --bad-soft: #3F201C; --good: #6FCD90; --good-soft: #163423;
    --seal: #F2685C; --hl: #301D1A; --gram: #5B4A10; --grid: #3A4240; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
    --l1: #4EC490; --l2: #43BBAE; --l3: #52B3DA; --l4: #6D9CEC; --l5: #9B96EE; --l6: #BF8CEA; --l7: #E082CB; --l8: #EE7FA3; --l9: #F28470;
    --t1: #F2877B; --t2: #6CCB8D; --t3: #6C9DEA; --t4: #BA94EE; --t5: #8F9C99; --ink-hz: #F1F3F0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0E0E; --surf: #161919; --surf2: #202424; --ink: #EDEFEC; --ink2: #A6AEAC; --ink3: #737B79;
  --line: #272C2B; --accent: #F2685C; --accent-ink: #2A0806; --accent-soft: #3A1B18;
  --warn: #E4A94B; --warn-soft: #3A2D12; --bad: #F18A7E; --bad-soft: #3F201C; --good: #6FCD90; --good-soft: #163423;
  --seal: #F2685C; --hl: #301D1A; --gram: #5B4A10; --grid: #3A4240; --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px rgba(0,0,0,.4);
  --l1: #4EC490; --l2: #43BBAE; --l3: #52B3DA; --l4: #6D9CEC; --l5: #9B96EE; --l6: #BF8CEA; --l7: #E082CB; --l8: #EE7FA3; --l9: #F28470;
  --t1: #F2877B; --t2: #6CCB8D; --t3: #6C9DEA; --t4: #BA94EE; --t5: #8F9C99; --ink-hz: #F1F3F0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0; min-height: 100%; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 50; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4, p { margin: 0; }
.wrap { max-width: 560px; margin: 0 auto; }
svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 18px; height: 18px; }
svg.i.lg { width: 26px; height: 26px; }
svg.i .f { fill: currentColor; stroke: none; }
.num { font-variant-numeric: tabular-nums; }
.zh { font-family: var(--f-zh); }
.kai { font-family: var(--f-kai); }
.muted { color: var(--ink2); } .faint { color: var(--ink3); }
.small { font-size: 13px; } .tiny { font-size: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; }
.sp { flex: 1; min-width: 0; }
.gap4 { gap: 4px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.center { text-align: center; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink2); font-weight: 650; }

/* ---------- level colours ---------- */
.l1 { --lc: var(--l1); } .l2 { --lc: var(--l2); } .l3 { --lc: var(--l3); } .l4 { --lc: var(--l4); } .l5 { --lc: var(--l5); }
.l6 { --lc: var(--l6); } .l7 { --lc: var(--l7); } .l8 { --lc: var(--l8); } .l9 { --lc: var(--l9); } .l0 { --lc: var(--ink3); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--lc, var(--ink3)); flex: none; }
.lvb { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 7px; background: color-mix(in srgb, var(--lc) 16%, transparent); color: var(--lc); font-size: 12px; font-weight: 750; letter-spacing: .01em; }

/* ---------- layout shell ---------- */
#main { max-width: 560px; margin: 0 auto; padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(92px + env(safe-area-inset-bottom, 0px)); }
#main.session { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.title { display: flex; align-items: flex-end; gap: 12px; padding: 14px 0 12px; }
.title h1 { font: 760 32px/1.1 var(--f-ui); letter-spacing: -.025em; }
.title p { font-size: 13.5px; color: var(--ink2); margin-top: 2px; }
.h2 { font: 700 19px/1.25 var(--f-ui); letter-spacing: -.01em; margin: 26px 0 10px; display: flex; align-items: baseline; gap: 8px; }
.h2 small { font-size: 13px; font-weight: 500; color: var(--ink2); letter-spacing: 0; }
.h2.first { margin-top: 6px; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 4px 13px; border-radius: 999px; background: var(--surf); border: 1px solid var(--line); color: var(--ink2); font-size: 14px; font-weight: 550; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.lv.on { background: var(--lc); border-color: var(--lc); color: #fff; }
.chip.lv.l0 { --lc: var(--ink); } .chip.lv.l0.on { color: var(--bg); }
.lvpick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lvpick .chip { justify-content: center; min-height: 40px; padding: 4px 0; min-width: 0; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surf2); color: var(--ink2); min-height: 22px; }
.tag.good { background: var(--good-soft); color: var(--good); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.acc { background: var(--accent-soft); color: var(--accent); }
.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 16px 8px; margin-inline: -16px; }
.hscroll::-webkit-scrollbar { display: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 8px 20px; border-radius: 14px; background: var(--surf2); font-weight: 650; text-align: center; }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.sm { min-height: 36px; padding: 5px 14px; font-size: 14px; border-radius: 11px; }
.btn.block { width: 100%; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .4; cursor: default; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; color: var(--ink2); flex: none; }
.iconbtn.on { color: var(--accent); background: var(--accent-soft); }
.iconbtn.sm { width: 36px; height: 36px; }

/* grouped lists (inset rows divided by hairlines) */
.group { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.group > * + * { border-top: 1px solid var(--line); }
.panel { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.panel + .panel { margin-top: 12px; }

/* ---------- bottom tabs ---------- */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid var(--line); padding: 0 max(6px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(6px, env(safe-area-inset-right, 0px)); }
#tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
#tabs button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 7px 0 6px; font-size: 10.5px; font-weight: 650; color: var(--ink3); min-height: 56px; letter-spacing: .01em; }
#tabs button.on { color: var(--accent); }
#tabs .ic { position: relative; display: block; line-height: 0; }
#tabs .badge { position: absolute; top: -4px; left: 14px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--seal); color: #fff; font-size: 10.5px; line-height: 17px; text-align: center; font-weight: 700; }

/* ---------- dictionary ---------- */
.dhint { padding-top: 24px; }
.dhint p { max-width: 36ch; margin-inline: auto; }
.rowhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.dhint .chiprow { justify-content: center; }
.dents { display: grid; gap: 0; margin-top: 4px; }
.dent { padding: 14px 0 12px; border-top: 1px solid var(--line); }
.dent:first-child { border-top: 0; padding-top: 4px; }
.dph { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 6px; font: 650 21px/1.3 var(--f-ui); }
.dent .alt { text-align: center; margin-top: 2px; }
.dfl { margin: 10px 0 0; padding-left: 1.5em; display: grid; gap: 5px; font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
.dfl li::marker { color: var(--ink3); font-weight: 600; font-size: 14px; }
.dcl { margin-top: 8px; font-size: 14px; color: var(--ink2); overflow-wrap: anywhere; }
.xr { display: inline; padding: 0; margin: 0; border: 0; background: none; color: var(--accent); font: 500 1.05em var(--f-zh); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
.dhint .chiprow + p { margin-top: 16px; }

/* ---------- speaking ---------- */
.tiles .tilebtn:last-child:nth-child(odd) { grid-column: 1 / -1; min-height: 0; }
.spk-line { font-size: 26px; line-height: 2; }
.sp-ok { color: var(--good); }
.sp-no { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 6px; }
.micbtn { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: #fff; display: inline-grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.micbtn svg { width: 32px; height: 32px; }
.micbtn.on { animation: micpulse 1.2s ease-in-out infinite; }
@keyframes micpulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 16px transparent; } }
@media (prefers-reduced-motion: reduce) { .micbtn.on { animation: none; } }

/* ---------- dictionary: writing pad ---------- */
.search .iconbtn { margin-right: -8px; }
.hwbox { margin-top: 12px; }
.hwcands { display: flex; align-items: center; gap: 6px; min-height: 52px; overflow-x: auto; padding: 2px 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.hwcands::-webkit-scrollbar { display: none; }
.hwc { flex: none; min-width: 48px; height: 48px; padding: 0 8px; border-radius: 12px; background: var(--surf); border: 1px solid var(--line); font: 500 28px/1 var(--f-zh); color: var(--ink-hz); }
.hwc:active { background: var(--accent-soft); }
.hwwrap { max-width: 300px; margin: 8px auto 0; }
.hwpad { display: block; width: 100%; aspect-ratio: 1; touch-action: none; user-select: none; -webkit-user-select: none; background: var(--surf); border: 1px solid var(--line); border-radius: 14px; cursor: crosshair; }
.hwpad .gl { stroke: var(--grid); stroke-width: .5; stroke-dasharray: 2 2; fill: none; }
.hwpad .hwink { fill: none; stroke: var(--ink-hz); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.hwpad .hwlive { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.hwbtns { display: flex; gap: 8px; max-width: 300px; margin: 8px auto 0; }
.hwbtns .btn { flex: 1; }

/* ---------- forms ---------- */
.search { display: flex; align-items: center; gap: 8px; background: var(--surf2); border-radius: 12px; padding: 0 12px; min-height: 44px; color: var(--ink3); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 16px; color: var(--ink); }
.seg { display: flex; background: var(--surf2); border-radius: 11px; padding: 3px; gap: 2px; width: 100%; }
.seg button { flex: 1; min-height: 34px; padding: 4px 8px; border-radius: 9px; font-size: 13.5px; color: var(--ink2); font-weight: 650; text-align: center; white-space: nowrap; }
@media (max-width: 399px) { .seg button { font-size: 12.5px; padding: 4px 2px; } }
.seg button.on { background: var(--surf); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.sw { position: relative; width: 50px; height: 30px; border-radius: 15px; background: var(--line); flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 32px; }
select { background: var(--surf2); border: 0; border-radius: 10px; min-height: 40px; padding: 4px 10px; max-width: 100%; }
.field { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; }
.field .lab { font-weight: 650; }
.field .lab small { display: block; font-weight: 400; color: var(--ink2); font-size: 13px; margin-top: 1px; }
.fr { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.bar { height: 8px; background: var(--surf2); border-radius: 4px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.k { background: var(--lc, var(--accent)); }
.bar i.s { background: color-mix(in srgb, var(--lc, var(--accent)) 45%, transparent); }
.bar.lvbar i { background: var(--lc); }
.empty { text-align: center; padding: 38px 12px; color: var(--ink2); }
.empty h3 { font: 700 18px var(--f-ui); color: var(--ink); margin-bottom: 6px; }

/* ---------- Today ---------- */
.hello { padding: 12px 0 6px; }
.hello .date { font-size: 13px; color: var(--ink2); font-weight: 600; }
.hello h1 { font: 760 32px/1.15 var(--f-ui); letter-spacing: -.025em; margin-top: 2px; }
.hero { position: relative; display: flex; gap: 14px; align-items: center; width: 100%; padding: 16px; border-radius: 20px; background: var(--surf); border: 1px solid var(--line); box-shadow: var(--shadow); margin-top: 12px; }
.hero.tint { background: linear-gradient(135deg, var(--accent-soft), var(--surf) 70%); }
.hero .t { flex: 1; min-width: 0; }
.hero .t .k { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
.hero .t h2 { font: 700 20px/1.25 var(--f-zh); margin-top: 3px; letter-spacing: -.005em; }
.hero .t p { font-size: 13.5px; color: var(--ink2); margin-top: 1px; }
.hero .go { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surf2) 0); position: relative; }
.ring::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--surf); }
.ring span { position: relative; font: 750 15px var(--f-ui); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--surf); border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px; text-align: center; }
.stat b { display: block; font: 750 22px/1.2 var(--f-ui); letter-spacing: -.02em; }
.stat span { font-size: 12px; color: var(--ink2); }
.wotd { display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; }
.wotd .hz { font: 500 38px/1.1 var(--f-zh); min-width: 1.6em; }
.tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tilebtn { display: flex; flex-direction: column; gap: 4px; padding: 14px; background: var(--surf); border: 1px solid var(--line); border-radius: 18px; min-height: 112px; position: relative; }
.tilebtn .ti { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 6px; }
.tilebtn b { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.tilebtn span { font-size: 12.5px; color: var(--ink2); line-height: 1.35; }
.tilebtn .cnt { position: absolute; right: 12px; top: 12px; min-width: 24px; height: 24px; border-radius: 12px; padding: 0 7px; background: var(--seal); color: #fff; font-size: 12.5px; font-weight: 700; display: grid; place-items: center; }
.hz-big { font-family: var(--f-zh); }

/* ---------- lesson rows ---------- */
.lrow { display: flex; gap: 14px; align-items: center; padding: 13px 14px; width: 100%; background: var(--surf); position: relative; }
.lrow:active { background: var(--surf2); }
.lrow .lt { width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--lc) 13%, transparent); color: var(--lc); font: 500 26px/1 var(--f-kai); position: relative; }
.lrow .lt.done::after { content: ""; position: absolute; right: -3px; bottom: -3px; width: 16px; height: 16px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px var(--surf); }
.lrow .lt.done::before { content: ""; position: absolute; right: 2px; bottom: 3px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) scale(.8); z-index: 1; }
.lrow .lb { flex: 1; min-width: 0; }
.lrow .py { font-size: 11.5px; color: var(--ink3); line-height: 1.2; }

":[[-1,[1745,2183,782,2184,"，",157,2185,364,2186,29,872,"。"],"The Forbidden City lies in the heart of Beijing and was the imperial palace of the Ming and Qing dynasties."],[-1,[598,2187,2188,2189,460,"，",1945,1201,37,2190,2023,988,18,332,1645,310,2191,870,2192,"。"],"It was completed in 1420, and altogether twenty-four emperors lived here and handled affairs of state."],[-1,[2193,1745,2194,1177,416,1530,251,2195,"，",37,2196,131,427,2197,"，",157,1936,34,229,489,29,2198,2199,2200,"。"],"The whole complex covers 720,000 square metres and has more than nine thousand rooms, making it the largest group of ancient palace buildings in the world."],[-1,[1745,29,2201,630,2202,2203,2204,"，",2205,2206,"，",2207,119,2208,29,2209,"。"],"The buildings are strictly arranged along a central axis and are symmetrical on both sides, showing the solemnity of imperial power."],[-1,[209,29,2210,310,1363,29,2211,1364,"，",18,2212,144,2213,2214,2215,"。"],"The yellow glazed tiles and red palace walls stand out remarkably under the blue sky."],[-1,[2216,460,"，",1745,2217,2218,"，",184,2219,2220,"。"],"In 1925 the Forbidden City became a museum, open to ordinary people."],[-1,[2221,"，",1655,37,34,2222,1470,54,332,1419,"，",1466,2223,2224,"，",1419,2225,2226,20,1744,29,2227,"。"],"Today more than ten million visitors come every year, and to protect the cultural relics the number of visitors is limited."],[-1,[1605,2228,1745,"，",2229,2228,20,1726,29,2230,"。"],"Walking into the Forbidden City, people feel as if they are entering the depths of history."]],"g":[["位于","位于 means \"to be located in\" and is formal.","这座城市位于长江边。","This city lies on the Yangtze.",["位于"]],["为了","为了 + purpose means \"in order to\".","为了健康，他每天跑步。","For his health, he runs every day.",["为了"]]],"q":[["Which dynasties used the Forbidden City as their palace?","Ming and Qing",["Tang and Song","Han and Jin","Yuan and Ming"]],["How many emperors lived there?","Twenty-four",["Ten","Fifty","Three"]],["Why is the number of visitors limited?" "，",2456,162,162,71,1046,1434,3000,"。"],"Walking in Chinese streets you notice an interesting phenomenon: from upscale malls to roadside stalls, nearly everyone pays by phone."],[-1,[2993,2994,3001,72,2803,3002,"，",3003,3004,603,3005,"。"],"The reason mobile payment spread so quickly is inseparable from its convenience."],[-1,[1542,2043,1248,3006,"，",221,3007,79,933,72,2422,3008,"，",2818,3009,20,3010,29,2048,"，",485,2019,20,3011,2424,3012,29,3013,"。"],"Just scan a QR code and a transaction is done in seconds, sparing the trouble of making change and avoiding the risk of carrying lots of cash."],[-1,[986,3014,3015,"，",598,3016,20,3017,2604,"；",986,3018,3015,"，",598,842,3019,645,1068,"、",3020,1247,3021,"。"],"For merchants it lowers operating costs; for consumers it also brings points and discounts."],[-1,[3022,"，",2993,2994,672,29,3023,2893,"，",485,529,3024,3025,3026,1029,2838,2819,20,3027,"。"],"At the same time, the huge amount of data accumulated gives financial institutions a basis for assessing personal credit."],[-1,[2605,"，",3028,3029,485,3030,197,3031,"，",1752,1029,2426,3032,"、",2559,3033,1247,1259,623,37,1311,"。"],"Yet behind the convenience lie hidden dangers, such as leaks of personal information and online fraud, which occur from time to time."],[-1,[244,3034,597,433,547,1779,2592,1434,"，",18,2749,3035,148,1927,2503,20,2296,"。"],"Some elderly people, unable to use smartphones, have instead met inconvenience in daily spending."],[-1,[3036,"，",2051,820,3014,2835,3037,3012,2994,29,2562,"，",3038,928,1029,71,433,590,2928,3039,"。"],"For this reason the government requires merchants to keep cash as an option, ensuring nobody is left behind."]],"g":[["之所以……是因为……","之所以 states the result first: \"the reason that ... is because\".","他之所以成功，是因为他很努力。","The reason he succeeded is that he worked hard.",["之所以"]],["与此同时","与此同时 means \"at the same time; meanwhile\".","与此同时，另一队也到了。","Meanwhile another team arrived.",["与此同时"]]],"q":[["How do people mostly pay in China?","By pho ,"。"],"This is the origin of the Mid-Autumn custom of admiring the moon and eating mooncakes."]],"g":[["趁","趁 means \"take advantage of (a moment)\".","趁热吃吧。","Eat it while it's hot.",["趁"]],["舍不得","舍不得 means \"can't bear to part with or do\".","他舍不得扔掉旧书。","He can't bear to throw out the old books.",["舍不得"]]],"q":[["Why did Hou Yi shoot down nine suns?","They were burning the crops",["They were too bright","The gods ordered it","He wanted to be famous"]],["Who gave Hou Yi the magic pill?","The Queen Mother of the West",["A fairy","The Moon Rabbit","A monk"]],["How does the story explain Mid-Autumn customs?","Hou Yi offered fruit and mooncakes to the moon",["People feared the suns","The emperor ordered it","It is a harvest rule"]]],"z":[[[2246,595,2249,144,20,405,365,913,"？"],[245,26,1895,2282,2283,20],[[245,481,64,20],[703,1099,36,2249,29],[36,39,2284]]],[[87,122,20,2246,2259,"？"],[2256],[[120,2023,1639],[22,1561],[120,365,360]]],[[1079,195,2285,475,29,2280,"？"],[2246,26,1878,310,1601,2286,122,314],[[1605,44,913],[988,144,20,1099],[153,157,2287,29,2288]]]]},{"i":"h8-03","l":7,"y":"a","c":"Literature","m":7,"s":"Original","t":[595,1872,3386],"te":"Why Read the Classics","su":"The case for reading old books in an age of short videos.","sp":[],"ss":[[-1,[18,867,2977,3387,171,2424,1076,29,1205,"，",3388,65,107,604,3386,3389,3390,202,20,2707,3391,"。"],"In an age when short videos take up much of our time, picking up a classic seems a luxury."],[-1,[2605,"，",3386,3001,3392,"，",3152,597,245,3393,434,20,1076,29,3394,"。"],"Yet classics endure precisely because they have withstood the test of time."],[-1,[120,1547,561,29,3386,3395,"，",2476,2593,3396,3397,"，",3398,3399,148,229,3400,29,1416,"，",2910,157,3401,"，",1320,831,856,299,3402,"。"],"A good classic often crosses time and space to touch what is most essential in human nature — joy, anger, sorrow and delight, love and hatred."],[-1,[1872,3386,"，",2342,72,3280,3278,"，",128,72,3403,3404,3405,"：",2455,120,1547,3406,3407,"、",3408,3409,29,881,3104,3410,"，",3411,2835,3412,144,576,54,"，",3413,3413,3414,"。"],"Reading classics not only broadens horizons but sharpens thought: faced with a complex, finely written masterpiece, readers must settle down and chew it over."],[-1,[2924,3415,3416,29,3417,"，",18,2936,961,3416,3418,29,2928,3419,3420,"。"],"This capacity for deep reading is especially precious in an age of fragmented reading."],[-1,[1212,"，",1872,3386,2815,1131,3421,"，",485,2815,3422,525,838,928,120,1547,3423,"。"],"Of course, reading classics need not seek quick results, nor must you force yourself to like every celebrated work."],[-1,[2346,412,525,3286,29,3395,3424,"，",446,204,"，",242,547,1870,"，",2016,2377,554,3425,1330,1758,29,2624,"，",485,547,552,127,3426,1048,"。"],"You might begin with works that interest you; slowly you'll find that words once obscure become familiar."],[-1,[2450,2490,29,3427,3428,"，",3377,1652,2707,3429,29,2817,"。"],"Conversing with great souls is itself an incomparable pleasure."]],"g":[["经久不衰","经久不衰 means \"enduringly popular\".","这首歌经久不衰。","This song has endured.",["经久不衰"]],["无与伦比","无与伦比 means \"unparalleled\".","她的美丽无与伦比。","Her beauty is incomparable.",["无与伦比"]]],"q":[["Why do classics endure?","They withstood the test of time",["They are short","They are cheap","They are new"]],["What does deep reading require?","Settling down and chewing it over",["Speed","Skipping","Short summaries"]],["What does the writer say about enjoyment?","Talking with great souls is incomparable",["Reading is a duty","Classics are boring","Movies are better"]]],"z":[[[3386,595,72,2954,414,"？"],[3393,434,20,1076,29,3394],[[245,41,867],[245,41,667],[245,41,491]]],[[3415,3416,671,21,"？"],[0,144,576,54,"，",3430,3431],[[629],[1814,197,1872],[114,3432,29,3433]]],[[1381,195,509,161,29,3434,"？"],[310,2490,29,3427,3428,"，",586,3435,311,3436],[[161,157,2707,3437],[3386,41,1855],[1383,128,561]]]]},{"i":"m01","l":7,"y":"a","c":"Culture","m":6,"s":"Original","t":[4224,3901,4337],"te":"A City's Memory","su":"An essay on the old streets and shops that quietly hold a city's collective memory.","sp":[],"ss":[[-1,[4349,4224,3901,4337,"，",4178,4240,4350,3856,1420,902,"，",4241,4351,3856,2016,4352,3923,4353,"。"],"A city's memory is often not hidden in museums, but scattered in those unremarkable corners."],[-1,[4354,4230,4355,4356,3923,4357,"，",3921,4358,3875,4359,2656,3923,4360,"，",4252,4361,440,4362,4363,4364,3923,4365,"。"],"An old street shaded by plane trees, a tailor's shop that has been open for half a century, or an alley entrance from which the smell of soy milk drifts on some early morning."],[-1,[4366,"，",4367,4224,4368,3923,4369,4370,4371,"，",1767,4372,4373,4337,3923,4374,4375,3644,4376,"。"],"However, as the pace of urban renewal keeps quickening, these spaces that carry collective memory are quietly disappearing."],[-1,[4377,4378,4379,4380,"，",2253,4291,3759,4381,3923,4382,"，",4086,3768,4383,3875,4384,4385,3923,4386,4387,"。"],"Bulldozers roar past, leaving uniform high-rises behind, yet also wiping out the emotional coordinates shared by several generations."],[-1,[4388,4389,"，",4146,3759,4390,4391,4392,3923,4393,"；",3768,4388,4394,"，",4395,4357,4239,3876,4396,4397,4398,"，",4241,4259,4399,3856,4400,4401,902,4402,"。"],"Some believe this is the price development must pay; others argue that protecting old streets does not mean rejecting modernization, but letting the new and the old coexist harmoniously in the same soil."],[-1,[4403,4306,4404,3679,"，",4405,3930,4406,4407,"。"],"How exactly to choose, I'm afraid, has no standard answer."],[-1,[3970,4408,3831,4409,4410,"，",4411,4412,4413,4414,4230,4415,4064,"，",3592,4291,4416,3759,4417,4418,"，",4419,4349,4224,3901,4420,"。"],"But we should at least realize that when the last old brick is taken down, what is lost is not only the building itself, but also the soul of a city."]],"g":[["随着…","随着 + a change introduces a trend that goes along with the result: \"as / along with …\".","随着天气变冷，人们穿上了厚衣服。","As the weather ,"荧":"熒","踊":"踴","优":"優","饵":"餌","渔":"漁","舆":"輿","绒":"絨","渊":"淵","阅":"閱","陨":"隕","酝":"醞","韵":"韻","攒":"攢","枣":"棗","贼":"賊","闸":"牐","榨":"搾","债":"債","斩":"斬","盏":"盞","崭":"嶄","绽":"綻","这":"這","侦":"偵","挣":"掙","睁":"睜","郑":"鄭","滞":"滯","贞":"貞","肿":"腫","昼":"晝","皱":"皺","诸":"諸","猪":"豬","贮":"貯","驻":"駐","铸":"鑄","专":"專","砖":"磚","赚":"賺","桩":"樁","兹":"茲","赁":"賃","钻":"鑽"},"CY":[["画蛇添足","huà shé tiān zú","draw a snake and add feet","To ruin something by adding what it does not need.","In a story from the Warring States Strategies, men raced to draw a snake. The first to finish added feet, so his snake no longer counted as a snake, and he lost the prize of wine.",[153,3104,1700,1510,41,938,20,"，",124,1919,120,1697,1652,1911,"。"],"The article is already clear. Adding another paragraph would only spoil it.",0,2,"畫蛇添足"],["守株待兔","shǒu zhū dài tù","wait by a stump for a hare","To wait for luck instead of making an effort.","The philosopher Han Feizi told of a farmer who saw a hare run into a tree stump and die. He gave up farming to wait by the stump for more hares.",[39,3096,1421,1885,"，",668,525,86,1580,"。"],"If you want to succeed, you cannot sit and wait for luck. You have to work.",0,2,""],["亡羊补牢","wáng yáng bǔ láo","mend the pen after a sheep is lost","It is not too late to fix a problem, even after a loss.","A minister told the king of Chu that a man who mends his pen after losing a sheep can still save the rest of his flock.",[153,1273,1098,981,4502,561,"，",906,4503,"，",842,4504,"。"],"You did badly on this exam, but if you fix your study now, it is not too late.",0,2,"亡羊補牢"],["对牛弹琴","duì niú tán qín","play the lute to an ox","To speak to someone who cannot understand.","The oxen in the old tale hear the music but cannot appreciate it. The idiom is often used with humour, or with a little scorn.",[36,1209,485,48,1758,1366,"，",242,1754,36,697,1250,"，",1813,157,4505,"。"],"He knows nothing about music, so talking to him about it is like playing the lute to an ox.",0,2,"對牛彈琴"],["井底之蛙","jǐng dǐ zhī wā","the frog at the bottom of a well","A person with a narrow view of the world.","In the Zhuangzi, a frog in a well thinks the sky is only as big as the round opening above it, until a turtle from the sea tells it about the ocean.",[131,2129,114,114,1182,"，",857,592,1954,"。"],"Go out and see more, and do not be a frog in a well.",0,2,""],["狐假虎威","hú jiǎ hǔ wēi","the fox borrows the tiger's might","To bully others by using a powerful person's name.","In the Strategies of the Warring States, a fox that was caught by a tiger told it to walk behind and watch the animals run. They ran from the tiger, not from the fox.",[36,1795,1607,29,518,"，",2000,1980,"，",986,2538,4506,"。"],"He is only the manager's friend, but he throws his weight around at his colleagues.",0,2,""],["杯弓蛇影","bēi gōng shé yǐng","the bow in the cup looks like a snake","To be afraid of something that is not there.","A man drank wine and saw a snake in his cup. He fell ill from fear, until he learned it was only the reflection of a bow hanging on the wall.",[636,107,73,77,933,44,"，",1813,157,4507,"。"],"She is scared by every little sound, as if she saw a snake in every cup.",0,3,""],["虎头蛇尾","hǔ tóu shé wěi","a tiger's head and a snake's tail","A strong start and a weak finish.","Used for plans, projects and books that begin with a lot of energy and then fade away.",[36,592,511,1581,4508,"，",1039,41,1621,"，",1865,933,2486,20,"。"],"He always starts a task with energy and then loses interest.",0,2,"虎頭蛇尾"],["鹤立鸡群","hè lì jī qún","a crane standing among chickens","To stand out clearly from the crowd.","Used as a compliment, often about someone's height or talent.",[36,443,413,443,4509,"，",1475,18,4473,115,4510,"。"],"He is tall and handsome and stands out in the crowd.",0,2,"鶴立雞群"],["一箭双雕","yí jiàn shuāng diāo","one arrow, two eagles","To achieve two goals with one action.","A general of the Northern dynasties was said to have shot two eagles with a single arrow. It is the Chinese cousin of \"killing two birds with one stone\".",[2068,1413,2818,4511,1840,443,4512,"，",1813,157,4513,"。"],"Cycling to work is exercise and saves money, which kills two birds with one stone.",0,2,"一箭雙雕"],["马到成功","mǎ dào chéng gōng","success arrives as soon as the horse does","Quick success.","A traditional good-luck wish, popular at the start of a new business or a journey.",[1484,242,491,1286,4514,"！"],"I wish you quick success in your new job!",0,1,"馬到成功"],["鸦雀无声","yā què wú shēng","not even a crow or sparrow makes a sound","Complete silence.","Used for rooms and crowds that suddenly go quiet.",[542,107,669,2267,"，",4515,115,933,4516,20,"。"],"As soon as the teacher walked in, the classroom went silent.",0,2,"鴉雀無聲"],["九牛一毛","jiǔ niú yì máo","one hair from nine oxen","A tiny part of something large.","The historian Sima Qian used it to say that his own death would count for no more than a hair on nine oxen.",[153,1174,526,986,36,1925,1795,4517,"。"],"This little money is a drop in the ocean for him.",0,3,""],["如鱼得水","rú yú dé shuǐ","like a fish that has found water","To be in one's element.","In the Three Kingdoms period, Liu Bei said he was like a fish that had found water after he met the strategist Zhuge Liang.",[67,20,491,1613,"，",36,4518,"，",592,127,41,1485,"。"],"At the new company he is in his element and enjoys the work.",0,2,"如魚得水"],["老马识途","lǎo mǎ shí tú","an old horse knows the way","An experienced person can show the way.","Han Feizi tells how an army lost its way and followed old horses, which led it home.",[153,363,670,36,669,20,1168,460,"，",1813,157,4519,"。"],"He has walked this road for twenty years, so he knows it like an old horse.",0,3,"老馬識途"],["守口如瓶","shǒu kǒu rú píng","keep your mouth shut like a bottle","To keep a secret.","A bottle with its cap on lets nothing out. It is often used for official secrets and private matters.",[153,1210,511,1246,242,1744,668,4520,"。"],"Please keep this matter strictly to yourself.",0,2,""],["一举两得","yì jǔ liǎng dé","one move, two gains","To gain two things with one action.","A common way to praise a clever plan.",[18,2621,1286,"，",2818,72,3208,443,72,493,3408,"，",1813,157,4521,"。"],"Working abroad earns money and teaches a language, so you gain two things at once.",1,1,"一舉兩得"],["三心二意","sān xīn èr yì","three hearts and two minds","To be undecided or half-hearted.","Used to criticise someone who cannot give one thing their full attention.",[512,29,68,172,4522,"。"],"Do not be half-hearted when you study.",1,1,""],["七上八下","qī shàng bā xià","seven up, eight down","To feel nervous and uneasy.","The numbers describe a heart that jumps up and down like buckets in a well.",[1247,1098,4523,29,68,"，",298,1052,1177,34,1180,144,"。"],"While I waited for my exam results, I felt very nervous.",1,2,""],["九死一生","jiǔ sǐ yì shēng","nine deaths and one life","To escape from great danger.","Often used for accidents, wars and serious illness.",[36,18,4524,148,4525,"，",906,1510,981,511,20,"。"],"He barely survived the earthquake, and now he is fine.",1,2,""],["十全十美","shí quán shí měi","ten parts complete, ten parts beautiful","Perfect in every way.","Often used in the negative: nothing in this world is perfect.",[1936,34,61,4526,29,162,"。"],"Nobody in this world is perfect.",1,1,""],["五花八门","wǔ huā bā mén","five flowers and eight doors","Of every kind; a great variety.","The phrase first described changing military formations. Now it means a wide range of things.",[1765,115,29,4527,4528,"，",298,48,559,178,1275,2707,"。"],"The drinks in the supermarket are so varied that I do not know which to buy.",1,2,"五花八門"],["一心一意","yì xīn yí yì","one heart, one mind","Wholeheartedly; with full attention.","Used for work, study and love alike.",[36,4529,204,3253,984,29,632,"。"],"He looks after his sick mother with all his heart.",1,1,""],["千方百计","qiān fāng bǎi jì","a thousand methods and a hundred plans","To try every possible means.","Often used for hard goals that require a lot of effort.",[36,4530,39,4502,34,1618,"。"],"He tried every way he could to get into university.",1,2,"千方百計"],["百发百中","bǎi fā bǎi zhòng","a hundred shots, a hundred hits","To hit the target every time.","The archer Yang Youji of the Spring and Autumn period was famous for hitting a willow leaf from a hundred paces. Now it is used for shooting, sports and predictions.",[36,989,1267,4531,4532,"。"],"He never misses a shot at basketball.",1,2,"百發百中"],["一见钟情","yí jiàn zhōng qíng","love at first sight","To fall in love at first sight.","钟情 means to give one's love.",[163,18,518,29,4533,34,4534,"。"],"They fell in love at first sight at a friend's wedding.",1,1,"一見鐘情"],["万无一失","wàn wú yì shī","ten thousand times without one mistake","Completely safe and sure.","Used for plans and arrangements.",[1250,1712,4535,"，",242,2013,1182,"。"],"This method is completely safe, so do not worry.",1,2,"萬無一失"],["三番五次","sān fān wǔ cì","three times, five times","Again and again.","Used for repeated actions, often annoying ones.",[298,4536,204,2399,36,"，",36,1320,978,20,"。"],"I reminded him again and again, but he still forgot.",1,2,""],["一帆风顺","yì fān fēng shùn","a smooth sail","Smooth progress with no trouble.","A very common good-luck wish for studies, work and travel.",[1484,242,4537,"！"],"I wish you smooth sailing!",1,1,"一帆風順"],["四面八方","sì miàn bā fāng","four sides and eight directions","From all directions.","Used for crowds and voices that come from every side.",[2349,1568,29,162,2098,4538,"。"],"The people at the contest came from all over.",1,1,""],["愚公移山","yú gōng yí shān","the Foolish Old Man moves the mountains","With perseverance, even the hardest task can be done.","In an old tale, an old man decided to dig away two mountains in front of his house. When laughed at, he said his sons and grandsons would carry on. Heaven moved the mountains for him.",[1542,37,2146,29,1869,"，",933,61,592,2681,29,511,"。"],"With the spirit of the Foolish Old Man, nothing is impossible.",2,2,""],["铁杵成针","tiě chǔ chéng zhēn","an iron rod becomes a needle","Patience can achieve anything.","Legend says the young poet Li Bai met an old woman who was grinding an iron rod into a needle. He understood that persistence pays off and went back to his books.",[493,1329,668,3294,4539,4540,202,4541,931,"，",4542,"。"],"Learning characters takes patience, like grinding an iron rod into a needle.",2,2,"鐵杵成針"],["滴水穿石","dī shuǐ chuān shí","dripping water pierces stone","Small efforts, kept up, can achieve great things.","A drop of water is weak, but drop after drop wears through a rock.",[1227,1872,416,1343,"，",4543,"，",107,460,936,242,547,37,41,489,2606,"。"],"Read for ten minutes a day, and after a year you will have improved a great deal.",2,2,""],["持之以恒","chí zhī yǐ héng","hold on to it with constancy","To keep at something steadily.","Often said about exercise, study and good habits.",[493,1693,229,1791,29,157,2942,"。"],"The most important thing in learning a language is to keep at it.",2,2,"持之以恆"],["废寝忘食","fèi qǐn wàng shí","give up sleep and forget meals","To be so absorbed that one forgets to eat or sleep.","Used as praise for hard workers, or with a smile for people who are hooked on a game.",[36,1466,4544,1098,"，",4545,204,4546,"。"],"He studied day and night, forgetting to eat and sleep, to prepare for the exam.",2,2,"廢寢忘食"],["凿壁偷光","záo bì tōu guāng","bore through the wall to borrow light","To study hard in spite of poverty.","The Han-dynasty scholar Kuang Heng was too poor to buy candles. He made a hole in the wall to read by the light of his neighbour's house.",[1886,37,4547,29,1897,"，",3330,512,433,815,983,"。"],"The old story of boring through the wall shows that poverty need not stop anyone from studying.",2,3,"鑿壁偷光"],["悬梁刺股","xuán liáng cì gǔ","tie hair to a beam, prick the thigh","To study with great determination.","Two scholars, Sun Jing and Su Qin, were said to keep themselves awake at night like this. It describes hard study.",[1466,4502,34,1618,"，",36,1227,4548,204,512,"。"],"To get into university, he studies as hard as the scholars of old.",2,3,"懸梁刺股"],["熟能生巧","shú néng shēng qiǎo","skill comes from familiarity","Practice makes perfect.","Used to encourage people who feel stuck while learning a skill.",[857,1792,"，",4549,"，",131,515,933,561,20,"。"],"Do not worry. Practice makes perfect, so keep trying.",2,1,""],["举一反三","jǔ yì fǎn sān","learn one, infer three","To learn many things from one example.","Confucius said he would only teach a student who could work out the other three corners after being shown one.",[561,663,547,4550,"，",433,157,201,547,4551,4552,"。"],"A good student can infer other cases and does not just memorise answers.",2,2,"舉一反三"],["温故知新","wēn gù zhī xīn","review the old to learn the new","To gain new insight by reviewing the past.","This line comes from the Analects of Confucius.",[4546,1556,29,4553,"，",485,157,2707,4554,"。"],"Reviewing old lessons is also a way to find something new.",2,2,"溫故知新"],["精益求精","jīng yì qiú jīng","good, and still better","To always try to do better.","Used for crafts, products and skills.",[153,40,1493,29,1786,986,928,1258,1230,71,4555,"。"],"The chef at this restaurant always tries to improve every dish.",2,2,""],["半途而废","bàn tú ér fèi","give up halfway","To quit before finishing.","The idiom often appears in the advice that one should never give up halfway.",[592,511,1421,4556,"。"],"You must not give up halfway.",2,2,"半途而廢"],["马马虎虎","mǎ mǎ hǔ hǔ","horse, horse, tiger, tiger","So-so; careless.","It has two meanings. As an answer to \"How are you?\" or \"How was it?\", it means \"so-so\". About a task, it means careless.",[36,592,1297,1581,303,4557,4558,"，",1086,3715,41,131,"。"],"He does his homework carelessly, so he makes many mistakes.",2,1,"馬馬虎虎"],["一丝不苟","yì sī bù gǒu","not one thread is careless","Very careful and exact.","Praise for people who do detailed work with great care.",[153,2023,542,986,1286,4559,"。"],"This teacher is meticulous in her work.",2,2,"一絲不苟"],["事半功倍","shì bàn gōng bèi","half the work, double the result","To get twice the result with half the effort.","Said of good methods and tools.",[1202,986,1749,"，",512,547,4560,"。"],"When you find the right method, you learn with much less effort.",2,2,""],["勤能补拙","qín néng bǔ zhuō","diligence makes up for clumsiness","Hard work can make up for lack of talent.","A common saying to encourage people who think they are not clever enough.",[298,48,553,"，",706,4561,72,4562,4563,"。"],"I am not clever, but hard work makes up for it.",2,2,"勤能補拙"],["学无止境","xué wú zhǐ jìng","there is no end to learning","There is always more to learn.","Often said by teachers, and often written on school walls.",[4564,"，",165,67,1636,"，",493,67,1636,"。"],"There is no end to learning. You learn as long as you live.",2,1,"學無止境"],["自食其力","zì shí qí lì","eat from one's own strength","To support oneself by one's own work.","Used for people who earn their own living.",[36,1370,1163,933,1039,4565,"。"],"He started to earn his own living at eighteen.",3,2,""],["助人为乐","zhù rén wéi lè","find joy in helping others","To take pleasure in helping others.","A traditional virtue that schools teach children.",[36,4566,"，",2026,71,838,36,"。"],"He enjoys helping others, and all his neighbours like him.",3,1,"助人為樂"],["见义勇为","jiàn yì yǒng wéi","see what is right and act bravely","To step in bravely for a just cause.","Often used in news about people who stop a thief or save someone in danger.",[153,2023,1633,4567,"，",1468,20,120,365,75,"。"],"This young man bravely stepped in and saved a child.",3,2,"見義勇為"],["谦虚谨慎","qiān xū jǐn shèn","modest and careful","Modest and prudent.","A quality that schools and employers like to praise.",[3116,20,561,4523,"，",485,668,4568,4569,"。"],"Even when you do well, you should stay modest.",3,2,"謙虛謹慎"],["口是心非","kǒu shì xīn fēi","the mouth says yes, the heart says no","To say one thing and mean another.","Used for people who are not sincere.",[36,1711,34,509,838,"，",1637,157,4570,"。"],"He says he likes it, but he does not mean it.",3,2,""],["言行一致","yán xíng yí zhì","words and deeds agree","To do what one says.","A virtue for leaders and teachers.",[542,820,171,"，",525,485,668,4571,"。"],"The teacher asks things of us and must also do them himself.",3,2,""],["言而有信","yán ér yǒu xìn","one's word can be trusted","To keep one's word.","In the Analects, Confucius says that a person who cannot be trusted is like a cart without the pin that joins it to its shafts.",[592,162,668,4572,"。"],"A person should keep their word.",3,1,""],["一言为定","yì yán wéi dìng","one word settles it","It is a deal.","Said at the end of an agreement.",[171,1213,1180,1174,780,"，",4573,"！"],"We meet at eight tomorrow, and that is settled!",3,1,"一言為定"],["说到做到","shuō dào zuò dào","when said, it is done","To do what one says.","Used for promises.",[36,4574,"，",1279,4575,"。"],"He does what he says and never lies.",3,1,"說到做到"],["脚踏实地","jiǎo tà shí dì","feet on solid ground","Down-to-earth; practical and steady.","Praise for people who work hard and do not dream of quick results.",[39,3096,2057,4576,"。"],"If you want to succeed, you have to be down-to-earth.",3,1,"腳踏實地"],["自高自大","zì gāo zì dà","think oneself high and great","Arrogant.","Used to warn against pride.",[36,3116,20,107,1174,4523,933,4577,"。"],"He became arrogant after a little success.",3,2,""],["心直口快","xīn zhí kǒu kuài","an honest heart and a quick mouth","Straightforward and outspoken.","Someone who says what they think at once.",[636,4578,"，",37,21,2945,933,509,21,"。"],"She is outspoken and says whatever is on her mind.",3,2,""],["胸有成竹","xiōng yǒu chéng zhú","having a complete bamboo in one's chest","To have a clear plan in mind.","The painter Wen Tong painted bamboo only after he could see the whole plant in his mind.",[1606,29,68,36,4579,"，",1209,485,48,3888,"。"],"He had a clear plan for the interview and was not at all nervous.",3,2,""],["刻舟求剑","kè zhōu qiú jiàn","notch the boat to find the sword","To act stubbornly without noticing that things have changed.","In a story from the Lüshi Chunqiu, a man dropped his sword from a boat and carved a mark on the side. He then waited for the boat to land to look for the sword under the mark.",[906,2928,552,20,"，",842,1046,1636,1712,1652,1992,"。"],"Times have changed, and using the old methods is like marking the boat to find the sword.",4,2,"刻舟求劍"],["掩耳盗铃","yǎn ěr dào líng","cover one's ears to steal a bell","To fool oneself.","A thief wanted to steal a bell, but it rang when he touched it. He covered his own ears and thought nobody else would hear it either.",[433,1898,523,"，",3715,485,842,18,"，",1380,157,2003,"。"],"If you do not tell anyone, the mistake is still there. You are only fooling yourself.",4,2,"掩耳盜鈴"],["自相矛盾","zì xiāng máo dùn","one's spear and shield contradict","To contradict oneself.","Han Feizi told of a man who sold a spear that could pierce anything, and a shield that nothing could pierce. A customer asked what would happen if the spear struck the shield.",[36,1945,509,1025,1933,"。"],"What he said before and after contradict each other.",4,2,""],["买椟还珠","mǎi dú huán zhū","buy the box and return the pearl","To choose the wrong thing and miss the real value.","A man bought a pearl in a beautiful box and kept the box. He gave the pearl back.",[178,519,201,114,4580,"，",157,4581,"。"],"Choosing a gift for its wrapping alone is like keeping the box and returning the pearl.",4,3,"買椟還珠"],["揠苗助长","yà miáo zhù zhǎng","pull the seedlings to help them grow","To ruin something by being too impatient.","In the Mencius, a farmer in Song pulled each of his seedlings a little to help them grow. By evening they had all died.",[626,75,1421,1964,1041,1965,"。"],"You cannot educate a child by pushing too hard.",4,2,"揠苗助長"],["邯郸学步","hán dān xué bù","learn to walk like the people of Handan","To lose one's own style while imitating others.","In the Zhuangzi, a young man went to the city of Handan to learn its way of walking. He forgot his own and had to crawl home.",[493,523,668,37,525,29,522,"，",172,4582,"。"],"When you learn from others, keep your own character and do not lose it.",4,3,"邯郸學步"],["画龙点睛","huà lóng diǎn jīng","paint the dragon and dot its eyes","To add the key touch that makes it come alive.","The painter Zhang Sengyou was said to have painted four dragons on a wall without eyes. When he added the eyes of two, they flew away.",[1700,35,120,121,1813,157,4583,"。"],"The last sentence of the essay is the finishing touch.",4,2,"畫龍點睛"],["望梅止渴","wàng méi zhǐ kě","look at plums to quench thirst","To comfort oneself with an empty hope.","Cao Cao told his thirsty army that a grove of plum trees lay ahead. The thought of sour plums made their mouths water.",[6,39,61,1046,"，",1421,4584,"。"],"Only thinking about it is of no use. You cannot quench your thirst by looking at plums.",4,2,""],["三顾茅庐","sān gù máo lú","visit the thatched hut three times","To invite someone with great sincerity.","The warlord Liu Bei visited the hut of Zhuge Liang three times before the strategist agreed to help him.",[1613,4585,"，",1246,36,54,541,1607,"。"],"The company went to him again and again until he agreed to be the manager.",4,2,"三顧茅庐"],["破釜沉舟","pò fǔ chén zhōu","smash the cooking pots and sink the boats","To act with total commitment, with no way back.","Xiang Yu led his army across a river and destroyed the boats and the pots, so that the soldiers had no choice but to fight. They won.",[36,4586,"，",424,20,1286,86,2563,"。"],"He burned his bridges, quit his job and started his own business.",4,2,""],["卧薪尝胆","wò xīn cháng dǎn","sleep on brushwood and taste gall","To endure hardship and prepare for revenge or a big goal.","After he lost a war, King Goujian of Yue slept on brushwood and tasted bitter gall every day so that he would not forget his shame. He later won his country back.",[36,4587,"，",1715,18,1568,148,4588,"。"],"He endured years of hard work and finally won the contest.",4,3,"臥薪嘗膽"],["纸上谈兵","zhǐ shàng tán bīng","talk about war on paper","To talk about theory with no practical ability.","The young general Zhao Kuo knew all the military books but lost a major battle when he commanded a real army.",[201,1268,48,3473,"，",1652,4589,"。"],"Reading books without practising is only talk on paper.",4,2,"紙上談兵"],["四面楚歌","sì miàn chǔ gē","Chu songs on all four sides","To be surrounded by enemies and have no help.","When Xiang Yu's army was surrounded, the enemy sang songs of Chu. He thought they had already taken his homeland.",[1613,2503,2525,"，",36,550,4590,"。"],"When the company ran into trouble, he felt he had enemies on every side.",4,2,""],["一鸣惊人","yì míng jīng rén","one call that astonishes everyone","To suddenly achieve something remarkable after a quiet start.","King Zhuang of Chu ignored state affairs for three years. A minister asked him about a bird that neither flew nor sang. The king replied that when it flew, it would reach the sky, and when it sang, it would astonish everyone.",[36,4591,"，",1388,604,548,933,248,20,107,891,251,604,"。"],"His first book sold a million copies, and the whole world was astonished.",4,2,"一鳴驚人"],["完璧归赵","wán bì guī zhào","return the jade to Zhao intact","To return something to its owner in perfect condition.","The envoy Lin Xiangru brought a precious jade to the powerful state of Qin and brought it safely home when the king of Qin broke his promise.",[548,298,114,3052,"，",906,4592,"。"],"I have finished the book, and now I return it to you in perfect condition.",4,3,"完璧歸赵"],["背水一战","bèi shuǐ yí zhàn","fight with the river at one's back","To fight with no way of retreat.","The general Han Xin put his army with its back to a river so that the soldiers had to fight to survive.",[153,1273,1098,157,4593,"，",2835,2804,"。"],"This exam is a do-or-die moment, and I must pass.",4,3,"背水一戰"],["志同道合","zhì tóng dào hé","the same goals, the same path","To share the same ideals.","Used for friends and partners who see the world alike.",[171,1537,4594,29,518,486,1341,20,107,40,4494,"。"],"A few like-minded friends and I opened a bookshop together.",5,2,""],["一见如故","yí jiàn rú gù","like old friends at the first meeting","To feel close from the first meeting.","Used when two people feel they have known each other for a long time.",[298,310,636,120,780,3138,4595,"，",1761,20,107,168,"。"],"She and I felt like old friends and talked all night.",5,2,"一見如故"],["情同手足","qíng tóng shǒu zú","feelings like hands and feet","As close as brothers or sisters.","Hands and feet are parts of one body.",[163,4596,4597,"。"],"The two of them are as close as brothers.",5,2,""],["相依为命","xiāng yī wéi mìng","depend on each other for life","To depend on each other to survive.","Often used for family members who have only each other.",[1496,310,2158,4598,"。"],"The grandmother and her grandson depend on each other.",5,2,"相依為命"],["同甘共苦","tóng gān gòng kǔ","share sweet and bitter","To share both good and hard times.","Used for couples, friends and teams.",[171,486,4599,20,416,460,"。"],"We have shared the good and the bad for ten years.",5,2,""],["青梅竹马","qīng méi zhú mǎ","green plums and a bamboo horse","Childhood friends who grew up together.","A line in a poem by Li Bai describes a boy riding a bamboo horse and a girl picking green plums.",[163,157,4600,"，",2347,933,1642,"。"],"They are childhood friends who have known each other since they were small.",5,2,"青梅竹馬"],["天伦之乐","tiān lún zhī lè","the joy of natural family ties","The happiness of a family.","Often said of grandparents who live with their children and grandchildren.",[1132,1462,"，",36,1379,2817,4601,"。"],"After he retired, he enjoyed the happiness of family life at home.",5,2,"天倫之樂"],["白头偕老","bái tóu xié lǎo","grow old together till the hair is white","To stay together as a couple to old age.","A traditional wish for newly-weds.",[1484,1241,4602,"！"],"I wish you a long and happy life together!",5,2,"白頭偕老"],["高山流水","gāo shān liú shuǐ","high mountains and flowing water","A deep friendship in which people truly understand each other.","The musician Bo Ya played tunes about mountains and rivers. Only his friend Zhong Ziqi understood them. When Zhong Ziqi died, Bo Ya broke his zither.",[163,157,2251,4603,4604,29,4605,"。"],"They are soulmates who truly understand each other.",5,3,""],["孟母三迁","mèng mǔ sān qiān","Mencius's mother moved three times","A parent who works hard to give a child a good environment.","The mother of the philosopher Mencius moved house three times, from near a graveyard and a market to near a school.",[1466,75,1382,"，",163,3294,4606,4607,806,611,931,1762,20,40,"。"],"They moved house for their child's school, just like Mencius's mother.",5,2,"孟母三遷"],["尊老爱幼","zūn lǎo ài yòu","respect the old and love the young","To respect the elderly and care for children.","A basic virtue on buses and in families.",[18,1511,"，",4608,157,2707,2568,"。"],"In China, respecting the old and caring for the young is a tradition.",5,1,"尊老愛幼"],["举案齐眉","jǔ àn qí méi","raise the tray to eyebrow height","Mutual respect between husband and wife.","Liang Hong's wife Meng Guang lifted the food tray to the height of her eyebrows when she served him, as a sign of respect.",[163,4609,4610,"，",406,162,4611,"。"],"The couple respect each other, and others envy them.",5,3,"舉案齊眉"],["塞翁失马","sài wēng shī mǎ","the old man at the border loses his horse","A loss may turn out to be a blessing.","In the Huainanzi, an old man's horse ran away. He said it might be lucky. The horse came back with another horse, then his son fell off it and broke a leg, which later saved him from the army.",[36,1313,20,1286,"，",1865,1999,20,128,561,29,"，",1813,157,2021,"。"],"He lost his job and later found a better one. It was a blessing in disguise.",6,2,"塞翁失馬"],["未雨绸缪","wèi yǔ chóu móu","mend the window before it rains","To prepare before trouble comes.","The line comes from the Book of Songs, where a bird repairs its nest before the rain.",[171,668,4612,"，",1128,3659,107,1174,526,"。"],"We should prepare in advance and save some money first.",6,3,"未雨綢缪"],["居安思危","jū ān sī wēi","in peace, think of danger","To be alert to danger in good times.","A line from the Zuo Zhuan.",[1613,3208,29,68,485,668,4613,"。"],"Even when the company is making money, it must be alert to danger.",6,2,""],["实事求是","shí shì qiú shì","seek truth from facts","To be practical and base decisions on facts.","A phrase from the Book of Han that became a famous slogan in modern China.",[592,2386,1744,668,4614,"。"],"In research one must always stick to the facts.",6,2,"實事求是"],["三思而行","sān sī ér xíng","think three times and act","To think carefully before acting.","The Analects say that Ji Wenzi thought three times before acting. Confucius said that twice was enough.",[178,704,157,2192,"，",668,4615,"。"],"Buying a flat is a big matter, so think carefully before you act.",6,2,""],["前车之鉴","qián chē zhī jiàn","the overturned cart ahead is a warning","A past failure that serves as a lesson.","The cart that overturned in front of you warns you of the danger on the road.",[36,29,4616,157,171,29,4617,"。"],"His failure is a lesson for us.",6,3,"前車之鑑"],["因小失大","yīn xiǎo shī dà","lose the big by caring about the small","To lose something big while trying to save something small.","Used for people who want to save a little money and end up losing a lot.",[1466,4618,221,1197,526,178,1670,2304,"，",1465,625,20,"，",1813,157,4619,"。"],"He bought a cheap item to save a few yuan, and it broke, so he lost more in the end.",6,2,""],["得不偿失","dé bù cháng shī","what is gained does not make up for the loss","The cost is greater than the benefit.","Used for decisions that do not pay off.",[2132,1286,"，",26,1840,4620,625,20,"，",4621,"。"],"Working late until you ruin your health is not worth it.",6,2,"得不償失"],["开卷有益","kāi juàn yǒu yì","opening a book is beneficial","Reading always does you good.","A saying linked to Emperor Taizong of Song, who set himself to read three volumes of a huge encyclopedia every day.",[4622,"，",1227,1872,107,1174,548,1182,"。"],"Reading always does you good, so read a little every day.",6,2,"開卷有益"],["入乡随俗","rù xiāng suí sú","when entering a village, follow its customs","When in Rome, do as the Romans do.","Used for travellers and newcomers.",[67,20,1511,"，",668,4623,"，",1046,4624,517,"。"],"In China, do as the locals do and eat with chopsticks.",6,1,"入鄉隨俗"],["世外桃源","shì wài táo yuán","a peach-blossom land beyond the world","An ideal place, quiet and far from the world.","The poet Tao Yuanming wrote about a fisherman who found a hidden village where people had lived in peace for hundreds of years.",[1250,95,335,3294,4625,760,4626,931,279,"。"],"This mountain village is as quiet as a paradise.",6,2,""],["取长补短","qǔ cháng bǔ duǎn","take the long to make up for the short","To learn from each other's strengths.","Used for teams, schools and companies.",[171,1950,512,"，",2909,"。"],"We learn from each other and make up for our weak points.",6,2,"取長補短"],["集思广益","jí sī guǎng yì","gather ideas and widen the benefit","To pool ideas for a better result.","Used in meetings and discussions.",[1317,4627,"，",1744,72,39,119,561,1712,"。"],"If we all share ideas, we can find a good solution.",6,3,"集思廣益"],["青出于蓝","qīng chū yú lán","blue comes from the indigo plant","The student surpasses the teacher.","The Xunzi says that blue dye comes from the indigo plant but is bluer than the plant itself.",[36,29,956,311,542,29,842,561,"，",1813,157,659,660,661,"。"],"His paintings are better than his teacher's. The student has surpassed the master.",6,3,"青出於藍"],["雪中送炭","xuě zhōng sòng tàn","send charcoal in the snow","To help someone when they need it most.","A help that comes at the right moment. It is the opposite of 锦上添花.",[18,298,229,2525,29,68,"，",242,4628,"，",298,1582,4629,"。"],"You helped me at my hardest time, and I will never forget it.",6,2,""],["锦上添花","jǐn shàng tiān huā","add flowers to brocade","To add something good to what is already good.","The opposite of 雪中送炭 (charcoal in the snow).",[36,437,1318,1380,63,"，",518,987,71,297,54,20,4630,"，",1813,157,4631,"。"],"On his birthday all his friends sent flowers, which was the icing on the cake.",6,2,"錦上添花"],["画饼充饥","huà bǐng chōng jī","draw a cake to ease hunger","To comfort oneself with empty fantasies.","In the Three Kingdoms period, an official wrote that a painted cake cannot satisfy hunger.",[6,39,433,592,"，",1795,4632,"。"],"Just thinking without acting is like drawing a cake to quench hunger.",6,3,"畫餅充飢"],["杀鸡取卵","shā jī qǔ luǎn","kill the hen to get the egg","To sacrifice long-term gain for a short-term profit.","It is like cutting open a hen to take all her eggs at once, and so losing the hen.",[4633,4634,712,157,4635,"。"],"Overfishing is killing the hen to get the eggs.",6,2,"殺雞取卵"],["爱屋及乌","ài wū jí wū","love the house and the crows on it","To love everything connected to someone you love.","Used for people whose affection extends to the loved one's relatives and belongings.",[36,4636,"，",860,4637,29,1225,485,41,838,"。"],"His love for her extends to everything around her, even her little dog.",6,3,"愛屋及烏"],["多此一举","duō cǐ yì jǔ","an unnecessary move","To do something unnecessary.","Used for actions that add nothing.",[242,1510,419,4498,20,"，",124,419,4638,1652,4639,"。"],"You already have an umbrella, so taking a raincoat too is unnecessary.",6,2,"多此一舉"],["好事多磨","hǎo shì duō mó","good things take much grinding","Good things come only after setbacks.","A saying used for weddings and big plans that go slowly.",[4640,"，",857,1792,"。"],"Good things take time, so do not worry.",6,2,""],["破镜重圆","pò jìng chóng yuán","a broken mirror made whole again","A couple reunited after being apart.","A husband and wife broke a mirror in two when war forced them apart, and each kept a half. Years later the halves were matched and the couple were together again.",[163,4641,936,443,310,561,20,"，",1813,157,4642,"。"],"They got back together after breaking up, like a broken mirror made whole.",6,3,"破鏡重圓"],["春暖花开","chūn nuǎn huā kāi","spring is warm and flowers open","Spring at its best.","Often used in letters and greetings in spring.",[45,2737,57,1341,29,68,"，",171,86,1423,76,1182,"。"],"When spring comes and the flowers open, let us go to the park.",7,1,"春暖花開"],["鸟语花香","niǎo yǔ huā xiāng","birds sing and flowers smell sweet","A lovely spring scene.","Used for gardens and the countryside.",[82,29,1423,115,4643,"。"],"In spring the park is full of birdsong and the scent of flowers.",7,1,"鳥語花香"],["风和日丽","fēng hé rì lì","gentle wind and bright sun","Mild and sunny weather.","Used for perfect days out.",[1205,4644,"，",2862,2129,76,"。"],"The weather is mild and sunny today, so it is good for going out.",7,2,"風和日麗"],["山清水秀","shān qīng shuǐ xiù","green hills and clear water","Beautiful scenery.","Used for lovely landscapes, such as Guilin.",[4645,29,117,4646,"。"],"The scenery of Guilin has green hills and clear water.",7,2,""],["万紫千红","wàn zǐ qiān hóng","ten thousand purples and a thousand reds","A rich variety of colours.","Used for gardens in full bloom.",[392,115,4647,"，",1391,3552,"。"],"The garden is full of colour and looks beautiful.",7,2,"萬紫千紅"],["秋高气爽","qiū gāo qì shuǎng","high autumn sky and fresh air","Clear, cool autumn weather.","Used to describe the best season in northern China.",[782,29,908,4648,"。"],"Autumn in Beijing is clear and fresh.",7,2,"秋高氣爽"],["冰天雪地","bīng tiān xuě dì","an ice sky and a snow ground","A world of ice and snow.","Used for cold, snowy places like Harbin.",[4649,29,909,644,63,23,4650,"。"],"Winter in the northeast is a world of ice and snow.",7,1,""],["一望无际","yí wàng wú jì","as far as the eye can see, no end","Stretching endlessly.","Used for the sea, plains and deserts.",[1475,18,263,"，",532,19,4651,29,110,"。"],"On top of the mountain, you can see the endless sea.",7,2,"一望無際"],["日新月异","rì xīn yuè yì","new by the day, different by the month","To change rapidly.","Often used of cities, technology and the economy.",[1511,29,393,2715,4652,"。"],"Chinese cities change rapidly.",7,2,"日新月異"],["天长地久","tiān cháng dì jiǔ","as long as heaven and earth","Everlasting.","Used for love, friendship and wishes.",[4653,171,29,4654,4655,"。"],"May our friendship last forever.",7,2,"天長地久"],["沧海桑田","cāng hǎi sāng tián","the blue sea turns into mulberry fields","Great changes over a long time.","A legend tells of an immortal who saw the sea turn into mulberry fields three times.",[1250,1570,221,416,460,981,54,"，",1813,157,4656,"。"],"I have not been here for decades, and everything has changed.",7,3,"滄海桑田"],["目不转睛","mù bù zhuǎn jīng","the eyes do not turn","To stare without looking away.","Used for children watching TV or people watching a show.",[75,4657,204,114,197,1214,"。"],"The child watched TV without looking away.",8,2,"目不轉睛"],["津津有味","jīn jīn yǒu wèi","with great relish","With great enjoyment.","Used for eating, reading and listening.",[36,4658,204,247,197,1495,"。"],"He ate the dumplings with great pleasure.",8,2,""],["狼吞虎咽","láng tūn hǔ yàn","swallow like a wolf and gulp like a tiger","To eat greedily and fast.","Used when someone is very hungry.",[36,1188,625,20,"，",4659,204,247,20,806,179,1858,"。"],"He was starving and wolfed down three bowls of rice.",8,2,""],["垂头丧气","chuí tóu sàng qì","head drooping, spirits low","Dejected.","Used for people who have just lost or failed.",[1568,1575,20,"，",1317,71,4660,"。"],"We lost the match, and everybody looked dejected.",8,2,"垂頭喪氣"],["手忙脚乱","shǒu máng jiǎo luàn","hands busy and feet in a mess","To be flustered and rushed.","Used for sudden busy moments.",[1832,2039,54,20,"，",632,793,1369,1051,2049,"。"],"The guests came suddenly, and Mum was in a flurry.",8,2,"手忙腳亂"],["无精打采","wú jīng dǎ cǎi","without spirit or colour","Listless.","Used for people who feel tired or sad.",[36,1207,981,1398,561,"，",1205,4661,"。"],"He did not sleep well last night and is listless today.",8,2,"無精打採"],["兴高采烈","xìng gāo cǎi liè","high spirits and bright colour","In high spirits.","Used for people who are very happy.",[1595,4662,204,86,4663,"。"],"The children set off on their spring outing in high spirits.",8,2,"興高採烈"],["喜出望外","xǐ chū wàng wài","joy beyond one's hopes","Overjoyed at an unexpected good thing.","Used for surprises.",[73,561,4664,"，",298,4665,"。"],"I was overjoyed to hear the good news.",8,2,""],["迫不及待","pò bù jí dài","too urgent to wait","Unable to wait.","Used for people who are eager to do something.",[1595,4666,204,2060,519,"。"],"The children could not wait to open their presents.",8,2,""],["左右为难","zuǒ yòu wéi nán","difficult on both the left and the right","To be in a dilemma.","Used when both choices are bad.",[364,365,1286,71,41,561,"，",298,2205,4667,"。"],"Both jobs are good, and I cannot decide.",8,2,"左右為難"],["哭笑不得","kū xiào bù dé","not knowing whether to cry or laugh","To find it both funny and annoying.","Used for silly situations.",[75,26,298,29,1434,1303,1112,20,1995,"，",298,1813,157,4668,"。"],"My child put my phone in the water, and I did not know whether to laugh or cry.",8,2,""],["目瞪口呆","mù dèng kǒu dāi","eyes wide and mouth open","To be stunned.","Used for big surprises.",[19,813,131,162,"，",36,4669,"。"],"When he saw so many people, he was stunned.",8,2,""],["不知所措","bù zhī suǒ cuò","not knowing what to do","To be at a loss.","Used for sudden, confusing situations.",[1345,4670,4671,"，",636,4672,"。"],"The first time she spoke on stage, she did not know what to do.",8,2,""],["讨价还价","tǎo jià huán jià","ask a price and bargain back","To bargain.","A usual activity at markets in China.",[18,112,2293,1378,532,4673,"。"],"You can bargain when you shop at small stores.",8,1,"討價還價"],["物美价廉","wù měi jià lián","good goods and a low price","Good quality at a low price.","Common in shop advertisements.",[153,40,2293,29,1416,4674,"。"],"Things in this shop are good and cheap.",8,2,"物美價廉"],["人山人海","rén shān rén hǎi","people mountain, people sea","A huge crowd.","Used for festivals and holidays.",[4675,29,68,"，",1423,115,162,95,162,99,"。"],"On National Day, the park is packed with people.",8,1,""],["车水马龙","chē shuǐ mǎ lóng","carria (function () {

});

var TIERS = [null, 'Everyday', 'Common', 'Literary'];
function charTrad(h) { var o = ''; for (var i = 0; i < h.length; i++) o += TRADCH[h[i]] || h[i]; return o; }

/* dictionary of every word that occurs in a lesson */
var dict = new Map();
function addTok(t, L, si) {

/* full HSK 1-9 list: fetched on demand */
var V = { ready: false, loading: false, failed: false, list: [], map: new Map(), byLv: {}, waiters: [] };

/* unified lookup: { h, py[], g, t, lv, meanings } for any word we know */

    return de ? { h: h, py: de.pys.map(function (s) { return s.toLowerCase(); }), g: dictGloss(de), t: de.t, lv: 0, all: de.d.join('; '), inLessons: false, e: null, dict: true } : null;
  }

  if (cy) { r.py = cy.py; r.g = cy.g; r.cy = true; }

}

  return {
    h: h, py: e ? e.py : v.py, g: e ? e.gl[0] : v.g, t: (v && v.t) || (e && e.t) || '',
    lv: v ? v.lv : (e ? e.lv : 0), all: v ? v.g : '', inLessons: !!e, e: e
  };
}
function lvOf(h) {
  var v = V.map.get(h);

}
function sentText(s) { return s.t.map(function (t) { return t.h || t.p; }).join(''); }

/* ===== state and persistence ===== */
function $(s, r) { return (r || document).querySelector(s); }

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

var KEY = 'shufang.v2', OLDKEY = 'shufang.v1';
var DEF = { script: 'simp', phon: 'pinyin', vis: 'smart', trans: false, tone: true, hiNew: false, size: 1, font: 'sans', level: 0, goal: 150, rate: 1, voice: '', dir: 'zh-en', listen: false, guide: true };

var CJKRE = /^[㐀-䶿一-鿿豈-﫿]{1,12}$/;

function fresh() { return { v: 2, updatedAt: 0, set: Object.assign({}, DEF), words: [], known: [], done: [], log: [], marks: [], last: null, wr: {}, flags: [], hist: [] }; }

function sanitize(o) {
  var f = fresh();

  var s = o.set && typeof o.set === 'object' ? o.set : {};

  });

  f.set.goal = clamp(Math.round(f.set.goal), 10, 5000);

  }

    .map(function (x) { return { lid: x.lid, si: num(x.si, -1), at: num(x.at, 0), note: typeof x.note === 'string' ? x.note.slice(0, 160) : '' }; });

/* union of two states: used when importing a backup */
function unionState(a, b) {
  var newer = b.updatedAt > a.updatedAt ? b : a;
  var out = fresh();
  out.updatedAt = Math.max(a.updatedAt, b.updatedAt);
  out.set = Object.assign({}, newer.set);

  [a, b].forEach(function (s) {
    s.words.forEach(function (w) {
      var o = wm.get(w.h);

    });
  });

    });

  var lm = new Map();
  [a, b].forEach(function (s) {
    s.log.forEach(function (r) {
      var o = lm.get(r.d);
      if (!o) lm.set(r.d, Object.assign({}, r));

    });
  });

  out.marks = Array.from(new Set(a.marks.concat(b.marks)));
  out.last = newer.last || a.last || b.last;
  out.hist = newer.hist.concat(newer === a ? b.hist : a.hist).filter(function (h, i, arr) { return arr.indexOf(h) === i; }).slice(0, 40);

  Object.keys(b.wr).forEach(function (c) { out.wr[c] = Math.max(out.wr[c] || 0, b.wr[c]); });

var S = fresh();

} catch (e) { /* storage unavailable */ }

var savedSet, knownSet, doneMap, savedMap;
function caches() {

function lessonList() {

      var qn = /^[a-z0-9üv:' ]+$/i.test(q) ? C.norm(q) : '';
      if (hay.indexOf(q) < 0 && !(qn && hay.replace(/[^a-z]/g, '').indexOf(qn) >= 0)) return false;

  if (!list.length) return '<div class="empty"><h3>Nothing here<\/h3><p>Try another level or format.<\/p><\/div>';

/* ---------- placement test ----------
   A real test, not a self-rating: multiple-choice "what does this word mean?" questions drawn from the HSK list.
   It searches for your level by bisection: 6 questions at a level, 4 or more right moves up, otherwise down.
   Guessing at random passes a round about 4% of the time, and "I don't know" counts as wrong. */
var PT = { per: 6, pass: 4 };
function ptUsable(w) {
  var g = (w.g || '').trim();
  return g && g.length <= 40 && g.charAt(0) !== '(' && !/^[A-Z]/.test(g) && !/^(surname|variant|abbr|see |used |classifier)/i.test(g) && w.h.length <= 4 && C.CJK.test(w.h);
}
function ptGloss(w) { return (w.g || '').split(/;\s*/)[0].replace(/\s*\([^)]*\)\s*$/, '').trim() || w.g; }
function ptWords(g) { return (g.toLowerCase().match(/[a-z]{4,}/g) || []); }
function ptQuestions(lv, seed) {
  var pool = (V.byLv[lv] || []).filter(ptUsable);
  var near = [];
  [lv - 1, lv, lv + 1].forEach(function (l) { if (V.byLv[l]) near = near.concat(V.byLv[l].filter(ptUsable)); });
  return C.shuffle(pool, seed).slice(0, PT.per).map(function (w, k) {
    var ans = ptGloss(w), bad = [], aw = ptWords(ans);
    C.shuffle(near, seed + ':d' + k).forEach(function (d) {
      if (bad.length >= 3 || d.h === w.h) return;
      var g = ptGloss(d);
      if (g.toLowerCase() === ans.toLowerCase() || bad.indexOf(g) >= 0) return;
      var dw = ptWords(g);
      if (dw.some(function (x) { return aw.indexOf(x) >= 0; })) return;   // avoid near-synonyms
      bad.push(g);
    });
    return { h: w.h, py: w.py, ans: ans, opts: C.shuffle([ans].concat(bad), seed + ':o' + k) };
  });
}
function startFinder() {
  loadVocab(function (ok) {
    if (!ok) { toast('Could not load the word list.'); return; }
    finder = { lo: 0, hi: 9, rounds: 0, asked: 0, right: 0, hist: [], res: null, intro: true };
    openSheet({ kind: 'finder' });
  });
}
function finderNext() {
  var f = finder;
  if (f.lo >= f.hi) { f.res = f.lo; return; }
  f.lv = Math.ceil((f.lo + f.hi) / 2); f.rounds++;
  f.qs = ptQuestions(f.lv, 'pt' + now() + ':' + f.rounds); f.i = 0; f.ok = 0;
  if (f.qs.length < PT.per) { f.res = f.lo; }   // not enough usable words (should not happen)
}
function finderAnswer(j) {
  var f = finder, q = f.qs[f.i];
  f.asked++;
  if (j >= 0 && q.opts[j] === q.ans) { f.ok++; f.right++; }
  f.i++;
  if (f.i >= f.qs.length) {
    var pass = f.ok >= PT.pass;
    f.hist.push({ lv: f.lv, ok: f.ok });
    if (pass) f.lo = f.lv; else f.hi = f.lv - 1;
    finderNext();
  }
}
function finderSheet() {
  var f = finder;
  if (f.intro) {
    return sheetHead('Placement test') + '<p class="muted" style="margin:0 0 6px;line-height:1.6">Choose the meaning of each word. The test climbs or drops a level depending on how you do and stops when it has found yours.<\/p>' +
      '<ul class="small muted" style="margin:8px 0 14px;padding-left:20px;line-height:1.7"><li>About 18 to 24 questions, 2 to 3 minutes.<\/li><li>If you do not know a word, tap “I don’t know”. A wrong guess costs the same, so do not guess.<\/li><li>No pinyin is shown, because this tests reading.<\/li><\/ul>' +
      '<button class="btn pri block" data-act="fstart">Start the test<\/button>';
  }
  if (f.res != null) {
    var rows = f.hist.slice().sort(function (a, b) { return a.lv - b.lv; }).map(function (h) { return '<div class="lvrow l' + h.lv + '"><span class="n"><span class="lvb l' + h.lv + '">' + h.lv + '<\/span>HSK ' + h.lv + '<\/span><div class="bar lvbar"><i style="width:' + Math.round(h.ok / PT.per * 100) + '%"><\/i><\/div><span class="small muted num" style="text-align:right">' + h.ok + '/' + PT.per + '<\/span><\/div>'; }).join('');
    return sheetHead('Your result') + '<div class="center" style="padding:10px 0 6px"><div class="bignum" style="color:var(--accent)">' + (f.res ? 'HSK ' + f.res : 'New') + '<\/div><p class="muted mt8">' + esc(f.res ? LEVELS[f.res].d : 'Start with HSK 1. Pinyin stays on for every word.') + '<\/p><\/div>' +
      '<div class="group mt12">' + rows + '<\/div><p class="small muted mt12">' + f.right + ' of ' + f.asked + ' answers correct. A short test is a rough guide, so you can change your level any time in Me.<\/p>' +
      '<button class="btn pri block mt12" data-act="fapply">Use ' + (f.res ? 'HSK ' + f.res : 'New') + '<\/button><button class="btn ghost block mt8" data-act="fstart">Take it again<\/button>';
  }
  var q = f.qs[f.i], total = PT.per * 4;   // 10 levels need at most 4 bisection rounds, so the bar only ever moves forward
  return '<div class="shead" style="padding-top:2px"><span class="small muted">Question ' + (f.asked + 1) + '<\/span><div class="prog"><i style="width:' + Math.round(f.asked / total * 100) + '%"><\/i><\/div><button class="iconbtn" data-act="close" aria-label="Stop the test">' + icon('close') + '<\/button><\/div>' +
    '<div class="qcard"><div class="qz" lang="' + lang() + '">' + esc(sc(q.h)) + '<\/div><p class="hint mt8">What does this word mean?<\/p><\/div>' +
    '<div class="choices">' + q.opts.map(function (o, j) { return '<button class="choice" data-act="fans" data-j="' + j + '">' + esc(o) + '<\/button>'; }).join('') + '<\/div>' +
    '<button class="btn ghost block mt8" data-act="fans" data-j="-1">I don’t know<\/button>';
}

/* ---------- writing ---------- */
function writeCandidates() {
  var freq = new Map(), saved = new Set();
  dict.forEach(function (e) {
    if (e.lv > uLevel() + 1 && !savedSet.has(e.h)) return;
    for (var i = 0; i < e.h.length; i++) { var c = e.h[i]; if (C.CJK.test(c)) freq.set(c, (freq.get(c) || 0) + e.n); }
  });
  S.words.forEach(function (w) { for (var i = 0; i < w.h.length; i++) saved.add(w.h[i]); });
  var arr = Array.from(freq.keys()).filter(function (c) { return hzHas(c) && (S.wr[c] || 0) < 5; });
  arr.sort(function (a, b) {
    return (S.wr[a] || 0) - (S.wr[b] || 0) || (saved.has(b) ? 1 : 0) - (saved.has(a) ? 1 : 0) || freq.get(b) - freq.get(a);
  });
  return arr;
}
function writeStart(chars) {

    hzLoad(cs, function (ok) {
      if (!ok) { toast('Could not load stroke data.'); return; }

      if (!cs.length) { toast('No stroke data for that character'); return; }

}
function charMeaning(c) {

}
