name: Android APK
# Builds the installable app (android/) from the web app in site/.
#   - every push to main:  download the APK from the run's "Artifacts" section
#   - push a tag like v1.0.0:  the APK is also attached to a GitHub Release (a public link you can send to friends)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the Android SDK pieces the app needs
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Build the signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Name the APK and check its signature
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Shufang.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs dist/Shufang.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging dist/Shufang.apk | head -12
          ls -l dist/Shufang.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shufang-apk
          path: dist/Shufang.apk
      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Shufang.apk
